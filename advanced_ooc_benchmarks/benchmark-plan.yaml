# Aligned 4/8/16 GB synthetic scaling sweep over 16/8/4 GB memory limits.
version: 1
root: /media/jannik/data/OOCExperiments
results: ${plan.root}/bench-results

tools:
  java: java
  python: /home/jannik/.venvs/systemds/bin/python
  spark_submit: /home/jannik/.venvs/spark35/bin/spark-submit
  systemds_jar: /home/jannik/Dev/SystemDSTest/systemds/target/SystemDS.jar
  prevision_adapter: ${plan.root}/tools/prevision/bin/adapter

environment:
  BENCH_ROOT: ${plan.root}
  BENCH_TMP_DIR: ${plan.root}/tmp
  SYSDS_LOCAL_TMPDIR: ${plan.root}/tmp/systemds
  SYSDS_SCRATCH_DIR: ${plan.root}/scratch_space
  JAVA_IO_TMPDIR: ${plan.root}/tmp/java
  SPARK_HOME: /home/jannik/.venvs/spark35/lib/python3.13/site-packages/pyspark

defaults:
  repetitions: 1
  # Dataset generation runs outside every run timeout. Two hours is generous for the
  # largest reblock here (64 GB) and still bounds a hung generator, which would
  # otherwise hold an unattended invocation open indefinitely.
  prepare_timeout_seconds: 21600
  resources:
    threads: 64
    ooc_broker_max: 4294967296
    dask_threads: auto
    # Worker processes for the Dask baseline, one per 3 GiB of dask_memory_limit, capped at
    # 8: a single in-process worker leaves most of the thread allowance idle (GIL + scheduler
    # share one process), while too little memory per worker pauses and restarts on chunk
    # residency. `auto` derives it in the runner; profiles pin it explicitly below.
    dask_workers: auto
    # Not the Zarr store's chunking: every arm loads through from_zarr, which inherits the
    # stored chunks, so nothing reads this today. It bounds any intermediate Dask decides
    # to auto-chunk, and is held at the same 100 MB the dense stores target so a fallback
    # cannot quietly introduce a differently sized tile.
    dask_chunk_size: 100MB
    dask_memory_limit: 3GiB
    python_jobs: 4
    prevision_cache_bytes: 10737418240
    prevision_arena: posix
    # PreVision parallelizes within a tile, not across tiles. Avoid inheriting
    # the 64-task-thread su02 allowance for its fresh per-operation thread teams.
    prevision_blas_threads: 4
    prevision_elementwise_threads: 1
    spark_threads: auto
    swap_max: 0
    timeout_seconds: 1800
    timeout_grace_seconds: 30

# A one-second cgroup-v2 sample is small enough for long sweeps while retaining
# CPU, memory/page-cache, pressure-stall, and physical-I/O trajectories.
telemetry:
  interval_seconds: 3

# Named profiles keep correlated cgroup and JVM settings together. A run may
# select one or a list with `resource_profiles: {group: scaling}`.
# Dask: 100 MB dense chunks; one worker process per 3 GiB of the Dask memory budget (capped
# at 8), with the profile's thread allowance split evenly across workers, so the worker count
# scales down with the cgroup profile and per-worker concurrency stays ~0.25 of worker memory;
# Spark: 128 MiB partitions, 4 tasks per 3 GiB heap, capped at 64; JVM cores stay independent.
resource_profiles:
  mem128: {memory_max: 128G, java_heap: 96g, dask_memory_limit: 96GiB, dask_threads: 64, dask_workers: 8, spark_threads: 64, ooc_replay_bytes: 402653184, ooc_replay_blocks: 16, ooc_partition_bytes: 0}
  mem32: {memory_max: 32G, java_heap: 24g, dask_memory_limit: 24GiB, dask_threads: 64, dask_workers: 8, spark_threads: 32, ooc_replay_bytes: 402653184, ooc_replay_blocks: 16, ooc_partition_bytes: 0}
  mem16: {memory_max: 16G, java_heap: 12g, dask_memory_limit: 12GiB, dask_threads: 32, dask_workers: 4, spark_threads: 16, ooc_replay_bytes: 402653184, ooc_replay_blocks: 16, ooc_partition_bytes: 0}
  # A dense 10,000-by-10,000 upper-bound tile occupies about 800 MB. PageRank's
  # physical tiles are sparse, but a 1 GiB source/replay grant also admits the dense bound.
  # Keep source/cache partitioning disabled for the comparison sweep; packing is evaluated
  # separately until every generic consumer supports the partitioned store contract.
  mem16_pagerank: {memory_max: 16G, java_heap: 12g, dask_memory_limit: 12GiB, dask_threads: 32, dask_workers: 4, spark_threads: 16, ooc_replay_bytes: 1073741824, ooc_replay_blocks: 4, ooc_partition_bytes: 0}
  # MLP retains 256 MiB weight chunks: 12 concurrent chunks occupy one quarter of 12 GiB.
  mem16_mlp: {memory_max: 16G, java_heap: 12g, dask_memory_limit: 12GiB, dask_threads: 12, dask_workers: 4, spark_threads: 16, ooc_replay_bytes: 402653184, ooc_replay_blocks: 16, ooc_partition_bytes: 0}
  mem8: {memory_max: 8G, java_heap: 6g, dask_memory_limit: 6GiB, dask_threads: 16, dask_workers: 2, spark_threads: 8, ooc_replay_bytes: 241591910, ooc_replay_blocks: 16, ooc_partition_bytes: 0}
  mem4: {memory_max: 4G, java_heap: 3g, dask_memory_limit: 3GiB, dask_threads: 8, dask_workers: 1, spark_threads: 4, ooc_replay_bytes: 120795955, ooc_replay_blocks: 16, ooc_partition_bytes: 0}

# Named sets of profiles, selected by a run as `resource_profiles: {group: <name>}` --
# the same form `dataset: {group: ...}` uses. Adding a profile here reaches every run
# that names the group, instead of every run repeating the list.

resource_groups:
  # The memory axis, split so phase 1 covers mem16 once and phase 2 covers the rest.
  memory_rest: [mem128, mem8, mem4]

# Correlated algorithm parameters expand as named cases rather than as an
# unrestricted Cartesian product. Each is split into the single case phase 1 runs
# for coverage and the remainder phase 5 runs for the scaling series.
parameter_cases:
  # Reference rows for kNN against a fixed 25,000-row query block: the distance
  # matrix is 4.0 / 8.0 / 16.0 / 32.0 GB. Cost grows linearly with the intermediate,
  # so even the largest case stays affordable.
  knn_anchor:
    - {id: knn4, reference_rows: 20000}
  knn_rest:
    - {id: knn8, reference_rows: 40000}
    - {id: knn16, reference_rows: 80000}
    - {id: knn32, reference_rows: 160000}

  # Training rows for the exact kernel solve. The Gram matrix is n^2 cells:
  # 1.25 / 5.0 / 20.0 GB, built from at most 51 MB of input.
  krr_anchor:
    - {id: krr4, train_rows: 12500}
  krr_rest:
    - {id: krr8, train_rows: 25000}
    - {id: krr16, train_rows: 50000}

  # Hidden width sets the model, which at 16,384 features is 5.2 GB of first-layer
  # weights. Nesterov SGD needs three copies live (weights, gradient, velocity), so
  # 15.6 GB -- the smallest width that cannot fit the mem16 profile's 12g heap, and
  # therefore unambiguously spilling on the model rather than on the data.
  mlp_hidden:
    - {id: h40, hidden_size: 40960}

templates:
  systemds-ooc:
    comparable: true
    blocksize_sweep: ooc
    command: >-
      "${tools.java}" -Xms${resources.java_heap} -Xmx${resources.java_heap}
      -XX:+UseG1GC -XX:G1HeapRegionSize=32m
      -XX:ActiveProcessorCount=${resources.threads}
      --add-modules=jdk.incubator.vector -Djava.io.tmpdir="${run.results}/java-tmp"
      -jar "${tools.systemds_jar}" -f "${run.entrypoint}" -exec singlenode
      -config "${run.results}/SystemDS-config.xml" -ooc -oocStats -stats
      ${run.systemds_args}
  # The in-memory reference: the same engine and the same blocked input as the OOC arm,
  # with the out-of-core path switched off. Below the memory budget it says what the OOC
  # machinery costs when nothing has to spill; above it, it fails at allocation, and that
  # boundary is the point of running it. It shares the OOC blocksize variant because it
  # reads the same X-bs<blen>.
  systemds-cp:
    comparable: true
    # CP is enabled explicitly only for cases whose complete working set fits the
    # configured heap. Most synthetic inputs are themselves larger than 12/24 GiB.
    enabled: false
    blocksize_sweep: ooc
    command: >-
      "${tools.java}" -Xms${resources.java_heap} -Xmx${resources.java_heap}
      -XX:+UseG1GC -XX:G1HeapRegionSize=8m
      -XX:ActiveProcessorCount=${resources.threads}
      --add-modules=jdk.incubator.vector -Djava.io.tmpdir="${run.results}/java-tmp"
      -jar "${tools.systemds_jar}" -f "${run.entrypoint}" -exec singlenode
      -config "${run.results}/SystemDS-config.xml" -stats
      ${run.systemds_args}
  systemds-cp-spoof:
    comparable: true
    enabled: true
    blocksize_sweep: ooc
    command: >-
      "${tools.java}" -Xms${resources.java_heap} -Xmx${resources.java_heap}
      -XX:+UseG1GC -XX:G1HeapRegionSize=8m
      -XX:ActiveProcessorCount=${resources.threads}
      --add-modules=jdk.incubator.vector -Djava.io.tmpdir="${run.results}/java-tmp"
      -jar "${tools.systemds_jar}" -f "${run.entrypoint}" -exec singlenode
      -config "${run.results}/SystemDS-config-spoof.xml" -stats
      ${run.systemds_args}
  systemds-spark:
    comparable: true
    enabled: true
    blocksize_sweep: spark
    required_tools: [spark_submit]
    # In local[N] there is no executor JVM: Spark's unified pool and SystemDS's own
    # 0.7*heap CP budget (OptimizerUtils.getLocalMemBudget) are the same bytes, so the
    # 0.6 default overcommits the heap and the run dies deserializing a broadcast on top
    # of a full MemoryStore. 0.25 keeps 0.7 + 0.25 under 1.0. SystemDS reads the same key
    # in SparkClusterConfig.analyzeSparkConfiguation, so the planner's storage and
    # broadcast budgets shrink with the real pool instead of drifting away from it.
    command: >-
      "${tools.spark_submit}" --master "local[${resources.spark_threads}]"
      --driver-memory "${resources.java_heap}" --executor-memory "${resources.java_heap}"
      --driver-java-options "-XX:+UseG1GC -XX:G1HeapRegionSize=32m
      -XX:ActiveProcessorCount=${resources.threads} --add-modules=jdk.incubator.vector
      --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/java.io=ALL-UNNAMED
      --add-opens=java.base/java.util=ALL-UNNAMED
      --add-opens=java.base/java.lang=ALL-UNNAMED
      --add-opens=java.base/java.lang.ref=ALL-UNNAMED
      --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
      --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
      -Djava.io.tmpdir=${run.results}/java-tmp"
      --conf "spark.executor.extraJavaOptions=-XX:ActiveProcessorCount=${resources.threads} --add-modules=jdk.incubator.vector
      --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/java.io=ALL-UNNAMED
      --add-opens=java.base/java.util=ALL-UNNAMED
      --add-opens=java.base/java.lang=ALL-UNNAMED
      --add-opens=java.base/java.lang.ref=ALL-UNNAMED
      --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
      --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
      -Djava.io.tmpdir=${run.results}/java-tmp"
      --conf "spark.local.dir=${run.results}/spark-local"
      --conf "spark.ui.enabled=false"
      --conf "spark.driver.maxResultSize=0"
      --conf "spark.default.parallelism=${resources.spark_threads}"
      --conf "spark.sql.shuffle.partitions=${resources.spark_threads}"
      --conf "spark.dynamicAllocation.enabled=false"
      --conf "spark.memory.fraction=0.25"
      --conf "spark.hadoop.fs.local.block.size=134217728"
      "${tools.systemds_jar}"
      -f "${run.entrypoint}" -exec spark
      -config "${run.results}/SystemDS-config.xml" -stats
      ${run.systemds_args}
  python:
    comparable: true
    enabled: true
    required_python_modules: [numpy]
    environment:
      OMP_NUM_THREADS: ${resources.threads}
      OPENBLAS_NUM_THREADS: ${resources.threads}
      MKL_NUM_THREADS: ${resources.threads}
      MALLOC_ARENA_MAX: 2
  dask:
    comparable: true
    enabled: true
    required_python_modules: [numpy, dask.array, distributed, zarr]
    environment:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      MALLOC_ARENA_MAX: 2
      DASK_ARRAY__CHUNK_SIZE: ${resources.dask_chunk_size}
  prevision:
    comparable: true
    enabled: false
    required_tools: [prevision_adapter]

datasets:
  # Anchor only: every dense-family dataset merges it. No run uses dense_1m itself.
  # the dataset its own directory, and change only the parameters.
  dense_1m: &dense_dataset
    directory: ${plan.root}/bench-data/dense
    parameters:
      {rows: 1000000, cols: 1024, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 7, generator_chunk_mib: 256, accept_legacy: true,
       systemds_chunk_mib: 128, prepare_java_heap: 8g}
    ready: [metadata.json]
    artifacts:
      X_raw:
        path: X.f64
        size_bytes_product: ["${dataset.rows}", "${dataset.cols}", 8]
        metadata:
          path: metadata.json
          expect:
            {rows: "${dataset.rows}", cols: "${dataset.cols}", classes: "${dataset.classes}",
             dtype: float64,
             layout: "row-major raw files; matching SystemDS binary blocks written through the Python API",
             generator: prepare_dense_dataset.py, generator_version: 1,
             distribution: "${dataset.distribution}", sparsity_requested: "${dataset.sparsity}",
             seed: "${dataset.seed}"}
          allow_fallback: "${dataset.accept_legacy}"
          fallback_expect:
            {rows: "${dataset.rows}", cols: "${dataset.cols}", classes: "${dataset.classes}",
             dtype: float64,
             layout: "row-major raw files; matching SystemDS binary blocks written through the Python API"}
      binary_y_raw: {path: binary_y.f64, size_bytes_product: ["${dataset.rows}", 8]}
      nn_y_raw: {path: nn_y.f64, size_bytes_product: ["${dataset.rows}", 8]}
    prepare:
      policy: auto
      command: |
        legacy_args=()
        if [ "${dataset.accept_legacy}" = true ]; then legacy_args+=(--accept-legacy); fi
        "${tools.python}" "${plan.dir}/prepare_dense_dataset.py" --out "${dataset.dir}" --rows ${dataset.rows} --cols ${dataset.cols} --classes ${dataset.classes} --sparsity ${dataset.sparsity} --distribution ${dataset.distribution} --seed ${dataset.seed} --chunk-mib ${dataset.generator_chunk_mib} "${legacy_args[@]}"
    variants:
      blocksize:
        artifacts:
          X:
            path: systemds/X-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.rows}", cols: "${dataset.cols}", rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
          binary_y:
            path: systemds/binary_y-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.rows}", cols: 1, rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
          nn_y:
            path: systemds/nn_y-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.rows}", cols: 1, rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
        prepare:
          policy: auto
          command: |
            prep_root="${dataset.dir}/.sysds-root-bs${run.blocksize}"
            mkdir -p "$prep_root/target" "$prep_root/conf" "${dataset.dir}/tmp/prepare-bs${run.blocksize}" "${dataset.dir}/scratch/prepare-bs${run.blocksize}" "${plan.root}/tmp/java"
            ln -sfn "${tools.systemds_jar}" "$prep_root/target/SystemDS.jar"
            if [ -d "$(dirname "${tools.systemds_jar}")/lib" ]; then
              ln -sfn "$(dirname "${tools.systemds_jar}")/lib" "$prep_root/target/lib"
            fi
            cat > "$prep_root/conf/SystemDS-config.xml" <<EOF
            <root>
              <sysds.localtmpdir>${dataset.dir}/tmp/prepare-bs${run.blocksize}</sysds.localtmpdir>
              <sysds.scratch>${dataset.dir}/scratch/prepare-bs${run.blocksize}</sysds.scratch>
              <sysds.defaultblocksize>${run.blocksize}</sysds.defaultblocksize>
              <sysds.ooc.io.direct>true</sysds.ooc.io.direct>
              <sysds.ooc.io.reader.buffersize>8388608</sysds.ooc.io.reader.buffersize>
              <sysds.ooc.io.reader.threads>16</sysds.ooc.io.reader.threads>
              <sysds.ooc.io.reader.poolsize>16</sysds.ooc.io.reader.poolsize>
            </root>
            EOF
            # 8g, raised from 3g: the reblock is itself an OOC job, and at blocksize 1000 each
            # block is 8MB against 2MB at 500. 3g survived the 16GB datasets and OOMed
            # assembling X-bs1000 for the 32GB ones. Prepare runs outside the run cgroups.
            SYSTEMDS_ROOT="$prep_root" JAVA_TOOL_OPTIONS="-Xmx${dataset.prepare_java_heap} -Djava.io.tmpdir=${plan.root}/tmp/java" "${tools.python}" "${plan.dir}/prepare_dense_systemds.py" "${dataset.dir}" --rows ${dataset.rows} --cols ${dataset.cols} --blocksize ${run.blocksize} --chunk-mib ${dataset.systemds_chunk_mib} --java "${tools.java}" --systemds-jar "${tools.systemds_jar}" --config "$prep_root/conf/SystemDS-config.xml" --java-heap ${dataset.prepare_java_heap} --java-tmp "${plan.root}/tmp/java" --replace-invalid --x-output "${dataset.dir}/systemds/X-bs${run.blocksize}" --binary-y-output "${dataset.dir}/systemds/binary_y-bs${run.blocksize}" --nn-y-output "${dataset.dir}/systemds/nn_y-bs${run.blocksize}"
      # The Dask arm's counterpart to the native SystemDS blocksize: an uncompressed
      # Zarr store of X, prepared outside the timed scope exactly like X-bs<blocksize>.
      # It is baseline_only because Dask and NumPy run in the single -baseline case that
      # carries no SystemDS blocksize. Only X is converted: the response vectors are one
      # column wide and are read eagerly as NumPy, so chunking them would add thousands
      # of kilobyte-sized tasks to every graph for a 32 MB operand.
      dask_chunk:
        baseline_only: true
        implementation_templates: [dask]
        artifacts:
          X_zarr:
            path: zarr/X.zarr
            metadata:
              path: zarr/X.zarr.json
              expect:
                {rows: "${dataset.rows}", cols: "${dataset.cols}",
                 row_chunk: "${run.dask_chunk}", col_chunk: "${dataset.cols}",
                 dtype: float64, compressor: none,
                 generator: prepare_zarr.py, generator_version: 1}
        prepare:
          policy: auto
          command: |
            "${tools.python}" "${plan.dir}/prepare_zarr.py" "${dataset.dir}/X.f64" "${dataset.dir}/zarr/X.zarr" --rows ${dataset.rows} --cols ${dataset.cols} --row-chunk ${run.dask_chunk} --chunk-mib ${dataset.systemds_chunk_mib} --replace-invalid
      prevision_gnmf_tile:
        baseline_only: true
        implementation_ids: [prevision-gnmf]
        artifacts:
          X_prevision: {path: "prevision/gnmf-tr${run.prevision_gnmf_tile}-tc${run.prevision_gnmf_tile_cols}-r${run.rank}-s${run.seed}/X.tilestore"}
          W_prevision: {path: "prevision/gnmf-tr${run.prevision_gnmf_tile}-tc${run.prevision_gnmf_tile_cols}-r${run.rank}-s${run.seed}/W.tilestore"}
          H_prevision: {path: "prevision/gnmf-tr${run.prevision_gnmf_tile}-tc${run.prevision_gnmf_tile_cols}-r${run.rank}-s${run.seed}/H.tilestore"}
          prevision_gnmf_manifest:
            path: "prevision/gnmf-tr${run.prevision_gnmf_tile}-tc${run.prevision_gnmf_tile_cols}-r${run.rank}-s${run.seed}/manifest.json"
            metadata:
              path: "prevision/gnmf-tr${run.prevision_gnmf_tile}-tc${run.prevision_gnmf_tile_cols}-r${run.rank}-s${run.seed}/manifest.json"
              expect: {generator: "prevision/prepare.py", generator_version: 2, mode: gnmf, rows: "${dataset.rows}", cols: "${dataset.cols}", tile_rows: "${run.prevision_gnmf_tile}", tile_cols: "${run.prevision_gnmf_tile_cols}", rank: "${run.rank}", seed: "${run.seed}"}
        prepare:
          policy: auto
          verify_source: true
          command: >-
            "${tools.python}" "${plan.dir}/prevision/prepare.py"
            --adapter "${tools.prevision_adapter}" --raw "${dataset.dir}/X.f64"
            --output "${dataset.dir}/prevision/gnmf-tr${run.prevision_gnmf_tile}-tc${run.prevision_gnmf_tile_cols}-r${run.rank}-s${run.seed}"
            --mode gnmf --rows ${dataset.rows} --cols ${dataset.cols}
            --tile-rows ${run.prevision_gnmf_tile} --tile-cols ${run.prevision_gnmf_tile_cols}
            --rank ${run.rank} --seed ${run.seed}
      prevision_gram_tile:
        baseline_only: true
        implementation_ids: [prevision-gram]
        artifacts:
          X_prevision: {path: "prevision/gram-tr${run.prevision_gram_tile}-tc${run.prevision_gram_tile_cols}/X.tilestore"}
          prevision_gram_manifest:
            path: "prevision/gram-tr${run.prevision_gram_tile}-tc${run.prevision_gram_tile_cols}/manifest.json"
            metadata:
              path: "prevision/gram-tr${run.prevision_gram_tile}-tc${run.prevision_gram_tile_cols}/manifest.json"
              expect: {generator: "prevision/prepare.py", generator_version: 2, mode: gram, rows: "${dataset.rows}", cols: "${dataset.cols}", tile_rows: "${run.prevision_gram_tile}", tile_cols: "${run.prevision_gram_tile_cols}"}
        prepare:
          policy: auto
          verify_source: true
          command: >-
            "${tools.python}" "${plan.dir}/prevision/prepare.py"
            --adapter "${tools.prevision_adapter}" --raw "${dataset.dir}/X.f64"
            --output "${dataset.dir}/prevision/gram-tr${run.prevision_gram_tile}-tc${run.prevision_gram_tile_cols}"
            --mode gram --rows ${dataset.rows} --cols ${dataset.cols}
            --tile-rows ${run.prevision_gram_tile} --tile-cols ${run.prevision_gram_tile_cols}

  dense_d16:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d16
    parameters:
      {rows: 2000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 103, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128, prepare_java_heap: 8g}

  dense_d32:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d32
    parameters:
      {rows: 4000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 104, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128, prepare_java_heap: 8g}

  dense_d64:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d64
    parameters:
      {rows: 8000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 105, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128, prepare_java_heap: 8g}

  # Three 4e9-cell reshapes of dense_d32. Holding the cell count fixed makes geometry
  # the only variable: at blocksize 1000 the base instance is a 4000x1 block grid, the
  # wide one is 40x100, and the two tall inputs are 40,000x1 and 400,000x1. The wide
  # instance is the only genuinely column-blocked input in the suite; the tallest one
  # deliberately stresses per-block scheduling and metadata with only 10 columns/block.
  dense_d32_tall:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d32-tall
    parameters:
      {rows: 40000000, cols: 100, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 106, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 32, prepare_java_heap: 30g,
       dask_chunk: 125000}

  dense_d32_tall10:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d32-tall10
    parameters:
      {rows: 400000000, cols: 10, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 108, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 32, prepare_java_heap: 30g,
       dask_chunk: 1250000}

  dense_d32_wide:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d32-wide
    parameters:
      {rows: 40000, cols: 100000, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 107, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128, prepare_java_heap: 8g}

  gnmf_d32:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/gnmf-d32
    parameters:
      {rows: 4000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: uniform_nonnegative, seed: 204, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128, prepare_java_heap: 8g}

  # Wide-hidden-layer MLP. 2.15 GB of input against a first-layer model of up to
  # 10.5 GB -- the one workload here where the object that does not fit is the
  # *model*, not the data or an activation. That distinction is what makes it
  # worth running: activation checkpointing, the technique the deep-learning
  # stack standardised on for memory pressure, has nothing to recompute when the
  # parameters are the problem, and sharding it across devices is unavailable on
  # a single node. Jankov et al. (VLDB 2019) report TensorFlow crashing above
  # 40,000 hidden units on a 60,000-feature input; the geometry here is scaled to
  # a single-node disk budget but keeps the same ratio of model to memory.
  #
  # 16,384 columns rather than 60,000 because the model is D*H and three copies
  # of it must be live: at D = 60,000 and H = 80,000 the scratch requirement
  # alone would be 115 GB before any engine overhead.
  mlp_wide:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/mlp-wide
    parameters:
      {rows: 16384, cols: 16384, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 29, generator_chunk_mib: 128,
       accept_legacy: false, systemds_chunk_mib: 128, prepare_java_heap: 8g}

  # Exact kernel ridge regression. 51 MB of input, a Gram matrix of 1.25 / 5.0 /
  # 20.0 GB at the three sizes in `krr_size` -- by far the widest input-to-
  # intermediate ratio in the suite, and the reason random Fourier features
  # (random_features/) exist at all. Running both makes the approximation and the
  # exact method a matched pair rather than two unrelated workloads.
  #
  # 128 columns matches rf_1m so the two share a feature dimension, and keeps the
  # kernel build traffic-dominated: 2*n^2*d flops against 8*n^2 bytes is 32 flops
  # per byte, a quarter of knn's ratio at 512 columns.
  krr_50k:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/krr-50k
    parameters:
      {rows: 50000, cols: 128, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 47, generator_chunk_mib: 128,
       accept_legacy: false, systemds_chunk_mib: 128, prepare_java_heap: 8g}

  twitter_10k:
    directory: ${plan.root}/bench-data/twitter-2010
    parameters:
      {vertices: 41652230, edges: 1468365182, blocksize: 10000,
       ordering: published, prepare_workers: 16,
       prepare_concurrency: 6, prepare_java_heap: 4g}
    ready: [metadata.json]
    artifacts:
      G:
        path: systemds/G-bs${dataset.blocksize}
        metadata:
          expect:
            {rows: "${dataset.vertices}", cols: "${dataset.vertices}", nnz: "${dataset.edges}",
             rows_in_block: "${dataset.blocksize}", cols_in_block: "${dataset.blocksize}"}
      dangling:
        path: systemds/dangling-bs${dataset.blocksize}
        metadata:
          expect: {rows: "${dataset.vertices}", rows_in_block: "${dataset.blocksize}"}
      csr_row_ptr:
        path: csr/row_ptr.i64
        size_bytes_from_metadata: {path: metadata.json, key: vertices, multiplier: 8, add: 8}
      csr_col_idx:
        path: csr/col_idx.i32
        size_bytes_from_metadata: {path: metadata.json, key: edges, multiplier: 4}
      csr_values:
        path: csr/values.f64
        size_bytes_from_metadata: {path: metadata.json, key: edges, multiplier: 8}
        metadata:
          path: metadata.json
          expect: {vertices: "${dataset.vertices}", edges: "${dataset.edges}"}
      dangling_raw:
        path: dangling.u8
        size_bytes_from_metadata: {path: metadata.json, key: vertices}
    prepare:
      policy: auto
      clean: ["systemds/G-bs${dataset.blocksize}", "systemds/G-bs${dataset.blocksize}.mtd",
              "systemds/dangling-bs${dataset.blocksize}", "systemds/dangling-bs${dataset.blocksize}.mtd"]
      env:
        PYTHON: ${tools.python}
        SYSDS_JAR: ${tools.systemds_jar}
        BENCH_DATA_DIR: ${plan.root}/bench-data
        REAL_WORLD_BLOCKSIZE: ${dataset.blocksize}
        REAL_WORLD_NATIVE_SUFFIX: -bs${dataset.blocksize}
        REAL_WORLD_VERTEX_ORDER: ${dataset.ordering}
        PREP_WORKERS: ${dataset.prepare_workers}
        PREP_CONCURRENCY: ${dataset.prepare_concurrency}
        # Six concurrent converters, each with a 4 GiB heap: 24 GiB plus JVM overhead.
        PREP_JAVA_HEAP: ${dataset.prepare_java_heap}
      command: >-
        "${plan.dir}/real_world/prepare.sh" twitter-2010 "${dataset.dir}"

  criteo_d21:
    directory: ${plan.root}/bench-data/criteo-d21
    parameters:
      # Recode-map broadcasts for all 26 Criteo categoricals are large. Keep
      # preparation concurrency conservative relative to the 24 GiB JVM heap.
      {rows: 192215183, cols: 39, blocksize: 100000, prepare_threads: 2,
       prepare_heap: 24g}
    ready: [metadata.json]
    artifacts:
      raw:
        path: D21.tsv
        metadata:
          path: metadata.json
          expect:
            {rows: "${dataset.rows}", raw_columns: 40, feature_columns: "${dataset.cols}",
             subset: all_rows,
             source.repository: criteo/CriteoClickLogs, source.path: data/day=2015-03-08,
             source.historical_file: day_21.gz, source.format: snappy-parquet,
             generator: sliceline/prepare.py, generator_version: 2}
    prepare:
      policy: auto
      clean: [D21.tsv, metadata.json]
      command: |
        set -euo pipefail
        "${tools.python}" "${plan.dir}/sliceline/prepare.py" \
          --out "${dataset.dir}" --rows ${dataset.rows} --raw-name D21.tsv --subset all_rows
        "${tools.spark_submit}" --master "local[${dataset.prepare_threads}]" \
          --driver-memory "${dataset.prepare_heap}" \
          --driver-java-options "-Djava.io.tmpdir=${dataset.dir}/tmp" \
          --conf "spark.local.dir=${dataset.dir}/spark-local" \
          --conf "spark.ui.enabled=false" \
          --conf "spark.driver.maxResultSize=0" \
          "${plan.dir}/sliceline/prepare_parquet.py" \
          --manifest "${dataset.dir}/parquet-manifest.json" \
          --out "${dataset.dir}/D21.tsv" --rows ${dataset.rows} --subset all_rows
        "${tools.python}" "${plan.dir}/sliceline/prepare.py" \
          --out "${dataset.dir}" --rows ${dataset.rows} --raw-name D21.tsv --subset all_rows --finalize
    variants:
      blocksize:
        artifacts:
          X:
            path: systemds/X-bs${run.blocksize}
            metadata:
              expect: {rows: "${dataset.rows}", cols: "${dataset.cols}", rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}
          e:
            path: systemds/e-bs${run.blocksize}
            metadata:
              expect: {rows: "${dataset.rows}", cols: 1, rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}
        prepare:
          policy: auto
          clean:
            ["systemds/X-bs${run.blocksize}", "systemds/X-bs${run.blocksize}.mtd",
             "systemds/.X-bs${run.blocksize}.mtd.crc",
             "systemds/e-bs${run.blocksize}", "systemds/e-bs${run.blocksize}.mtd",
             "systemds/.e-bs${run.blocksize}.mtd.crc"]
          command: |
            set -euo pipefail
            mkdir -p "${dataset.dir}/systemds" "${dataset.dir}/spark-local" "${dataset.dir}/tmp" "${dataset.dir}/scratch"
            prep_config="${dataset.dir}/SystemDS-config-prepare.xml"
            cat > "$prep_config" <<EOF
            <root>
              <sysds.localtmpdir>${dataset.dir}/tmp</sysds.localtmpdir>
              <sysds.scratch>${dataset.dir}/scratch</sysds.scratch>
              <sysds.defaultblocksize>${run.blocksize}</sysds.defaultblocksize>
            </root>
            EOF
            "${tools.spark_submit}" --master "local[${dataset.prepare_threads}]" \
              --driver-memory "${dataset.prepare_heap}" \
              --driver-java-options "--add-modules=jdk.incubator.vector
              --add-opens=java.base/java.nio=ALL-UNNAMED
              --add-opens=java.base/java.io=ALL-UNNAMED
              --add-opens=java.base/java.util=ALL-UNNAMED
              --add-opens=java.base/java.lang=ALL-UNNAMED
              --add-opens=java.base/java.lang.ref=ALL-UNNAMED
              --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
              --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
              --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
              -Djava.io.tmpdir=${dataset.dir}/tmp" \
              --conf "spark.executor.extraJavaOptions=--add-modules=jdk.incubator.vector
              --add-opens=java.base/java.nio=ALL-UNNAMED
              --add-opens=java.base/java.io=ALL-UNNAMED
              --add-opens=java.base/java.util=ALL-UNNAMED
              --add-opens=java.base/java.lang=ALL-UNNAMED
              --add-opens=java.base/java.lang.ref=ALL-UNNAMED
              --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
              --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
              --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
              -Djava.io.tmpdir=${dataset.dir}/tmp" \
              --conf "spark.local.dir=${dataset.dir}/spark-local" \
              --conf "spark.ui.enabled=false" \
              --conf "spark.driver.maxResultSize=0" \
              --conf "spark.default.parallelism=${dataset.prepare_threads}" \
              --conf "spark.sql.shuffle.partitions=${dataset.prepare_threads}" \
              --conf "spark.memory.fraction=0.25" \
              "${tools.systemds_jar}" -f "${plan.dir}/sliceline/prepare_systemds.dml" \
              -exec spark -config "$prep_config" -stats \
              -args "${dataset.dir}/D21.tsv" \
              "${dataset.dir}/systemds/X-bs${run.blocksize}" \
              "${dataset.dir}/systemds/e-bs${run.blocksize}" ${run.blocksize}

  # Intermediate-bound pair. Both datasets are small enough to sit in memory at
  # every profile; what does not fit is what the algorithm builds from them, so
  # these two say something the input-bound sweeps above cannot. They are also
  # nearly free on disk -- together under 2 GB of raw plus their prepared copies,
  # against 96 GB for one dense instance -- because the large object of each run
  # is never stored at all.

  # Brute-force kNN: 819 MB of input, a query-by-reference distance matrix of
  # 4.0 / 8.0 / 16.0 / 32.0 GB at the four reference sizes in `knn_reference`.
  # 200,000 rows leaves the 25,000-row query block clear of the largest reference
  # block, and every boundary the run slices at -- 20,000 / 40,000 / 80,000 /
  # 160,000 and the query start at 175,000 -- is a multiple of the 5,000-row Dask
  # chunk, so no arm reads a partial chunk.
  knn_200k:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/knn-200k
    parameters:
      {rows: 200000, cols: 512, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 43, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128, prepare_java_heap: 8g}

dataset_groups:
  # The ladder phase 3 walks at a fixed 32 GB budget: 0.5x, 1x and 2x data:memory.
  dense_ladder: [dense_d16, dense_d32, dense_d64]
  dense_tall: [dense_d32_tall, dense_d32_tall10]

systemds_setup: &systemds_setup
  command: |
    mkdir -p "${run.results}/systemds-tmp" "${run.results}/systemds-scratch" "${run.results}/spark-local" "${run.results}/java-tmp"
    cat > "${run.results}/SystemDS-config.xml" <<EOF
    <root>
      <sysds.localtmpdir>${run.results}/systemds-tmp</sysds.localtmpdir>
      <sysds.scratch>${run.results}/systemds-scratch</sysds.scratch>
      <sysds.defaultblocksize>${run.blocksize}</sysds.defaultblocksize>
      <sysds.ooc.io.direct>true</sysds.ooc.io.direct>
      <sysds.ooc.io.reader.buffersize>8388608</sysds.ooc.io.reader.buffersize>
      <sysds.ooc.io.reader.threads>16</sysds.ooc.io.reader.threads>
      <sysds.ooc.io.reader.poolsize>16</sysds.ooc.io.reader.poolsize>
      <sysds.ooc.materialized.partition.bytes>${resources.ooc_partition_bytes}</sysds.ooc.materialized.partition.bytes>
      <!--<sysds.native.blas>openblas</sysds.native.blas>-->
      <sysds.ooc.memory.broker.fraction>0.3333333333333333</sysds.ooc.memory.broker.fraction>
      <sysds.ooc.memory.broker.max>${resources.ooc_broker_max}</sysds.ooc.memory.broker.max>
      <sysds.ooc.memory.prefetch.fraction>0.1</sysds.ooc.memory.prefetch.fraction>
      <sysds.ooc.memory.prefetch.max>1073741824</sysds.ooc.memory.prefetch.max>
      <sysds.ooc.memory.cache.fraction.soft>0.5</sysds.ooc.memory.cache.fraction.soft>
      <sysds.ooc.memory.cache.fraction.hard>0.6</sysds.ooc.memory.cache.fraction.hard>
      <sysds.ooc.source.replay.memory>${resources.ooc_replay_bytes}</sysds.ooc.source.replay.memory>
      <sysds.ooc.source.bulksize>${resources.ooc_replay_bytes}</sysds.ooc.source.bulksize>
      <sysds.ooc.source.replay.prefetch>${resources.ooc_replay_blocks}</sysds.ooc.source.replay.prefetch>
    </root>
    EOF
    sed 's|</root>|<sysds.codegen.enabled>true</sysds.codegen.enabled></root>|' \
      "${run.results}/SystemDS-config.xml" > "${run.results}/SystemDS-config-spoof.xml"

runs:
  # Opt-in PreVision pilot. Generate benchmark-plan-prevision.generated.yaml with
  # prevision/make_plan.py; the main sweep does not acquire a new build dependency.
  - id: gnmf_prevision
    enabled: false
    dataset: gnmf_d32
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/gnmf/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 12500
      # 100 full-width tiles of 320 MB, matching the paper's 32 GB tile bytes/count.
      prevision_gnmf_tile: 40000
      prevision_gnmf_tile_cols: 1000
      rank: 16
      iterations: 3
      epsilon: 1e-8
      seed: 23
      systemds_args: >-
        -args "${input.X}" ${run.rank} ${run.iterations} ${run.epsilon} ${run.seed}
        "${run.outputs}/systemds-W-r${rep}" "${run.outputs}/systemds-H-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 3600}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: dask-multiplicative-updates
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/gnmf/dask_array.py" "${dataset.dir}"
          --rank ${run.rank} --iterations ${run.iterations} --epsilon ${run.epsilon}
          --seed ${run.seed} --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"
      - id: prevision-gnmf
        # Raw workload DAG: gnmf/prevision.c; run.py is the reusable launcher.
        template: prevision
        enabled: true
        command: >-
          "${tools.python}" "${plan.dir}/prevision/run.py"
          --adapter "${tools.prevision_adapter}" --mode gnmf
          --x "${artifact.X_prevision}" --w "${artifact.W_prevision}" --h "${artifact.H_prevision}"
          --rank ${run.rank} --iterations ${run.iterations} --epsilon ${run.epsilon}
          --cache-bytes ${resources.prevision_cache_bytes} --arena ${resources.prevision_arena}
          --threads ${resources.prevision_blas_threads} --elementwise-threads ${resources.prevision_elementwise_threads}
          --work-dir "${run.results}/prevision-work"
          --output-prefix "${run.outputs}/prevision-r${rep}"
          --engine-log "${run.results}/logs/prevision-engine-r${rep}.log"
          --lock "${plan.root}/tools/prevision/run.lock"

  - id: gram_prevision
    enabled: false
    dataset: dense_d32
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/gram/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 12500
      prevision_gram_tile: 40000
      prevision_gram_tile_cols: 1000
      systemds_args: >-
        -args "${input.X}" "${run.outputs}/systemds-G-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: numpy-gram
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/gram/numpy.py" "${dataset.dir}"
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-gram
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/gram/dask_array.py" "${dataset.dir}"
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"
      - id: prevision-gram
        # Raw workload DAG: gram/prevision.c, linked by prevision/setup.sh.
        template: prevision
        enabled: true
        command: >-
          "${tools.python}" "${plan.dir}/prevision/run.py"
          --adapter "${tools.prevision_adapter}" --mode gram
          --x "${artifact.X_prevision}"
          --cache-bytes ${resources.prevision_cache_bytes} --arena ${resources.prevision_arena}
          --threads ${resources.prevision_blas_threads} --elementwise-threads ${resources.prevision_elementwise_threads}
          --work-dir "${run.results}/prevision-work"
          --output-prefix "${run.outputs}/prevision-r${rep}"
          --engine-log "${run.results}/logs/prevision-engine-r${rep}.log"
          --lock "${plan.root}/tools/prevision/run.lock"

  # Execution order is plan order, and each dataset is staged immediately before the
  # first run that needs it, so the phases below are also the staging order.
  #
  # `blocksize_sweeps` names one blocksize per backend, and the two are independent:
  # OOC (and CP, which shares its sweep) uses 1500; Spark keeps its own sizes.
  # Dense OOC blocks hold up to 18 MB. The 18 MiB reader buffer fits a full record;
  # 16 I/O workers issue concurrent reads and the pool retains at most 16 readers.
  # Existing native variants are reblocked during preparation instead of reimported.
  # PageRank retains its sparse-specific 10000 blocksize. OOC and Spark candidates
  # are independent,
  # so each sweep creates backend-specific cases and the ungrouped Python/Dask
  # implementations run once in a shared <run-id>-baseline case.
  #
  # `dask_chunk` is the row height of the prepared Zarr store, chosen as the largest
  # exact divisor of the dataset -- so no trailing chunk is padded -- that keeps the run's
  # largest materialized tile inside its workload-specific bound. Which tile that is depends
  # on the kernel. Matvec and Gram reductions contract to something tiny, so the input
  # band dominates and 100 MB bands use the tuned LMCG target. knn and kernel_ridge instead form a
  # chunk x chunk distance or kernel matrix, so the row height squares into the output
  # tile and has to come down; see the note on each.
  #
  # Full-width bands rather than square tiles: every reduction here is row-local, and
  # splitting columns forces a combine none of them ask for. Square tiles are also not
  # reachable on a tall-skinny shape without falling far below the size guidance -- at
  # 1,000 columns a square tile is 8 MB -- because a Dask chunk is also its unit of
  # scheduling, where specialized SystemDS primitives may batch several blocks per task.

  # ---------------------------------------------------------------------------
  # Phase 1 -- coverage cut-through
  #
  # Every dense algorithm against every backend once, at the shared anchor: 32 GB of
  # data against a 16 GB budget (2x), one blocksize, one parameter case. This is the
  # cheapest configuration that exercises the matrix, so a backend that cannot run at
  # all fails here rather than eight hours in. Phases 2-5 vary one thing at a time away
  # from this anchor and never repeat a cell it already covers.
  #
  # Datasets are staged immediately before the run that needs them, so phase 1 needs
  # only dense_d32, gnmf_d32, knn_200k and mlp_wide on disk.
  # ---------------------------------------------------------------------------
  # Least squares by conjugate gradient.
  - id: lmcg
    dataset: dense_d32
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/lmcg/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 12500
      # raised from 2: conjugate gradient needs ~10-100 steps to be CG at all.
      iterations: 10
      reg: 1e-7
      tolerance: 0.0
      systemds_args: >-
        -args "${input.X}" "${input.y}" ${run.reg} ${run.iterations} ${run.tolerance}
        "${run.outputs}/systemds-beta-r${rep}"
    inputs: {X: {artifact: X}, y: {artifact: binary_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      - id: numpy-cg
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/lmcg/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations} --reg ${run.reg} --tolerance ${run.tolerance}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-cg
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/lmcg/dask_array.py" "${dataset.dir}"
          --iterations ${run.iterations} --reg ${run.reg} --tolerance ${run.tolerance}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # Lloyd's algorithm, 32 centroids.
  - id: kmeans
    dataset: dense_d32
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/kmeans/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 12500
      clusters: 32
      # raised from 2: Lloyd's algorithm runs to convergence; 2 steps is one refinement.
      iterations: 10
      systemds_args: >-
        -args "${input.X}" ${run.clusters} ${run.iterations}
        "${run.outputs}/systemds-centers-r${rep}"
        "${run.outputs}/systemds-labels-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      - id: numpy-lloyd
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/kmeans/numpy.py" "${dataset.dir}"
          --clusters ${run.clusters} --iterations ${run.iterations}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: sklearn-minibatch
        template: python
        required_python_modules: [numpy, sklearn]
        command: >-
          "${tools.python}" "${plan.dir}/kmeans/sklearn_batching.py" "${dataset.dir}"
          --clusters ${run.clusters} --passes ${run.iterations}
          --batch-rows ${run.dask_chunk}
          --output "${run.outputs}/sklearn-r${rep}.json"
      - id: dask-lloyd
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/kmeans/dask_array.py" "${dataset.dir}"
          --clusters ${run.clusters} --iterations ${run.iterations}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # L2 SVM, CG with line search.
  - id: l2svm
    dataset: dense_d32
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/l2svm/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 12500
      # raised from 3: an SVM solved in 3 outer steps is not a converged fit, and at
      # 3 the ~15s JVM warmup dominated the measurement rather than the OOC path.
      iterations: 10
      inner_iterations: 20
      tolerance: 0.0
      reg: 1.0
      systemds_args: >-
        -args "${input.X}" "${input.y}" ${run.tolerance} ${run.reg}
        ${run.iterations} ${run.inner_iterations}
        "${run.outputs}/systemds-model-r${rep}"
    inputs: {X: {artifact: X}, y: {artifact: binary_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
