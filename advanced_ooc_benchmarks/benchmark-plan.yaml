# Aligned 4/8/16 GB synthetic scaling sweep over 16/8/4 GB memory limits.
version: 1
root: /media/jannik/data/OOCExperiments
results: ${plan.root}/bench-results

tools:
  java: java
  python: /home/jannik/.venvs/systemds/bin/python
  spark_submit: /home/jannik/.venvs/spark35/bin/spark-submit
  systemds_jar: /home/jannik/Dev/SystemDSReview/systemds/target/SystemDS.jar

environment:
  BENCH_ROOT: ${plan.root}
  BENCH_TMP_DIR: ${plan.root}/tmp
  SYSDS_LOCAL_TMPDIR: ${plan.root}/tmp/systemds
  SYSDS_SCRATCH_DIR: ${plan.root}/scratch_space
  JAVA_IO_TMPDIR: ${plan.root}/tmp/java
  SPARK_HOME: /home/jannik/.venvs/spark35/lib/python3.13/site-packages/pyspark

defaults:
  repetitions: 1
  resources:
    threads: auto
    dask_threads: auto
    dask_chunk_size: 32MiB
    dask_memory_limit: 3GiB
    python_jobs: 4
    spark_threads: auto
    swap_max: 0
    timeout_seconds: 60
    timeout_grace_seconds: 30

# A one-second cgroup-v2 sample is small enough for long sweeps while retaining
# CPU, memory/page-cache, pressure-stall, and physical-I/O trajectories.
telemetry:
  interval_seconds: 3

# Named profiles keep correlated cgroup and JVM settings together. A run may
# select one or a list with `resource_profiles: {group: scaling}`.
resource_profiles:
  # java_heap is three quarters of the cgroup limit and the Dask limit matches it, so
  # the two runtimes are given the same share of the budget rather than each taking
  # its own default. Note that java_heap also caps the OOC tile budget through
  # min(heap/9, 1 GiB), which is what bounds the usable blocksize; above a 9g heap
  # that term saturates and blocksize stops depending on the profile.
  mem100: {memory_max: 100G, java_heap: 75g, dask_memory_limit: 75GiB}
  mem16: {memory_max: 16G, java_heap: 12g, dask_memory_limit: 12GiB}
  mem8: {memory_max: 8G, java_heap: 6g, dask_memory_limit: 6GiB}
  mem4: {memory_max: 4G, java_heap: 3g, dask_memory_limit: 3GiB}

# Named sets of profiles, selected by a run as `resource_profiles: {group: <name>}` --
# the same form `dataset: {group: ...}` uses. Adding a profile here reaches every run
# that names the group, instead of every run repeating the list.
resource_groups:
  # The shipped sweep: data:memory of 2x, 4x and 8x on the 32 GB datasets.
  scaling: [mem16, mem8, mem4]
  # Add the in-memory reference point on a host that has the RAM for it. At 100 GB
  # every dataset here fits, so these cases measure what the out-of-core machinery
  # costs when nothing needs to spill.
  # scaling: [mem100, mem16, mem8, mem4]

# Correlated algorithm parameters expand as named cases rather than as an
# unrestricted Cartesian product. These activation sizes are exact GiB for
# 65,536 FP64 rows.
parameter_cases:
  # Output width of the random Fourier map. The map is n-by-D, so at a million
  # rows these are 4.1 / 8.2 / 16.4 / 32.8 GB. Forming the Gram costs 2*n*D^2, so
  # the widest case is roughly 33 TFLOP against 5 TFLOP for rf16 -- quadratic in
  # the very parameter that makes the intermediate grow, which is why it is listed
  # but left out of the default sweep.
  rf_width:
    - {id: rf4, features: 512}
    - {id: rf8, features: 1024}
    - {id: rf16, features: 2048}
    # - {id: rf32, features: 4096}

  # Reference rows for kNN, against a fixed 25,000-row query block: the distance
  # matrix is 4.0 / 8.0 / 16.0 / 32.0 GB. Unlike the map above, the cost here grows
  # linearly with the intermediate, so the largest case stays affordable.
  knn_reference:
    - {id: knn4, reference_rows: 20000}
    - {id: knn8, reference_rows: 40000}
    - {id: knn16, reference_rows: 80000}
    - {id: knn32, reference_rows: 160000}

  # Hidden width sets the model, which at 16,384 features is 1.3 / 2.6 / 5.2 /
  # 10.5 GB of first-layer weights -- 0.4x to 3.5x the mem4 profile's 3g heap.
  # Nesterov SGD needs three of them live (weights, gradient, velocity), so the
  # resident requirement is three times those figures. Capped at 80k: 160k would
  # be 21 GB per copy and the scratch alone would exceed the suite's disk budget.
  mlp_hidden:
    - {id: h10, hidden_size: 10240}
    - {id: h20, hidden_size: 20480}
    - {id: h40, hidden_size: 40960}
    - {id: h80, hidden_size: 81920}

  # Training rows for the exact kernel solve. The Gram matrix is n^2 cells:
  # 1.25 / 5.0 / 20.0 GB, built from at most 51 MB of input.
  krr_size:
    - {id: krr4, train_rows: 12500}
    - {id: krr8, train_rows: 25000}
    - {id: krr16, train_rows: 50000}

templates:
  systemds-ooc:
    comparable: true
    blocksize_sweep: ooc
    command: >-
      "${tools.java}" -Xms${resources.java_heap} -Xmx${resources.java_heap}
      -XX:+UseG1GC -XX:G1HeapRegionSize=8m
      -XX:ActiveProcessorCount=${resources.threads}
      --add-modules=jdk.incubator.vector -Djava.io.tmpdir="${run.results}/java-tmp"
      -jar "${tools.systemds_jar}" -f "${run.entrypoint}" -exec singlenode
      -config "${run.results}/SystemDS-config.xml" -ooc -oocStats -stats
      ${run.systemds_args}
  systemds-spark:
    comparable: true
    enabled: true
    blocksize_sweep: spark
    required_tools: [spark_submit]
    # In local[N] there is no executor JVM: Spark's unified pool and SystemDS's own
    # 0.7*heap CP budget (OptimizerUtils.getLocalMemBudget) are the same bytes, so the
    # 0.6 default overcommits the heap and the run dies deserializing a broadcast on top
    # of a full MemoryStore. 0.25 keeps 0.7 + 0.25 under 1.0. SystemDS reads the same key
    # in SparkClusterConfig.analyzeSparkConfiguation, so the planner's storage and
    # broadcast budgets shrink with the real pool instead of drifting away from it.
    command: >-
      "${tools.spark_submit}" --master "local[${resources.spark_threads}]"
      --driver-memory "${resources.java_heap}" --executor-memory "${resources.java_heap}"
      --driver-java-options "-XX:+UseG1GC -XX:G1HeapRegionSize=8m
      -XX:ActiveProcessorCount=${resources.spark_threads} --add-modules=jdk.incubator.vector
      --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/java.io=ALL-UNNAMED
      --add-opens=java.base/java.util=ALL-UNNAMED
      --add-opens=java.base/java.lang=ALL-UNNAMED
      --add-opens=java.base/java.lang.ref=ALL-UNNAMED
      --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
      --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
      -Djava.io.tmpdir=${run.results}/java-tmp"
      --conf "spark.executor.extraJavaOptions=--add-modules=jdk.incubator.vector
      --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/java.io=ALL-UNNAMED
      --add-opens=java.base/java.util=ALL-UNNAMED
      --add-opens=java.base/java.lang=ALL-UNNAMED
      --add-opens=java.base/java.lang.ref=ALL-UNNAMED
      --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
      --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
      -Djava.io.tmpdir=${run.results}/java-tmp"
      --conf "spark.local.dir=${run.results}/spark-local"
      --conf "spark.ui.enabled=false"
      --conf "spark.driver.maxResultSize=0"
      --conf "spark.default.parallelism=${resources.spark_threads}"
      --conf "spark.sql.shuffle.partitions=${resources.spark_threads}"
      --conf "spark.dynamicAllocation.enabled=false"
      --conf "spark.memory.fraction=0.25"
      "${tools.systemds_jar}"
      -f "${run.entrypoint}" -exec spark
      -config "${run.results}/SystemDS-config.xml" -stats
      ${run.systemds_args}
  python:
    comparable: true
    enabled: true
    required_python_modules: [numpy]
    environment:
      OMP_NUM_THREADS: ${resources.threads}
      OPENBLAS_NUM_THREADS: ${resources.threads}
      MKL_NUM_THREADS: ${resources.threads}
      MALLOC_ARENA_MAX: 2
  dask:
    comparable: true
    enabled: true
    required_python_modules: [numpy, dask.array, distributed, zarr]
    environment:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      MALLOC_ARENA_MAX: 2
      DASK_ARRAY__CHUNK_SIZE: ${resources.dask_chunk_size}

datasets:
  # Dense datasets share this declarative contract. Copy/merge the anchor, give
  # the dataset its own directory, and change only the parameters.
  dense_1m: &dense_dataset
    directory: ${plan.root}/bench-data/dense
    parameters:
      {rows: 1000000, cols: 1024, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 7, generator_chunk_mib: 256, accept_legacy: true,
       systemds_chunk_mib: 128}
    ready: [metadata.json]
    artifacts:
      X_raw:
        path: X.f64
        size_bytes_product: ["${dataset.rows}", "${dataset.cols}", 8]
        metadata:
          path: metadata.json
          expect:
            {rows: "${dataset.rows}", cols: "${dataset.cols}", classes: "${dataset.classes}",
             dtype: float64,
             layout: "row-major raw files; matching SystemDS binary blocks written through the Python API",
             generator: prepare_dense_dataset.py, generator_version: 1,
             distribution: "${dataset.distribution}", sparsity_requested: "${dataset.sparsity}",
             seed: "${dataset.seed}"}
          allow_fallback: "${dataset.accept_legacy}"
          fallback_expect:
            {rows: "${dataset.rows}", cols: "${dataset.cols}", classes: "${dataset.classes}",
             dtype: float64,
             layout: "row-major raw files; matching SystemDS binary blocks written through the Python API"}
      binary_y_raw: {path: binary_y.f64, size_bytes_product: ["${dataset.rows}", 8]}
      nn_y_raw: {path: nn_y.f64, size_bytes_product: ["${dataset.rows}", 8]}
    prepare:
      policy: auto
      command: |
        legacy_args=()
        if [ "${dataset.accept_legacy}" = true ]; then legacy_args+=(--accept-legacy); fi
        "${tools.python}" "${plan.dir}/prepare_dense_dataset.py" --out "${dataset.dir}" --rows ${dataset.rows} --cols ${dataset.cols} --classes ${dataset.classes} --sparsity ${dataset.sparsity} --distribution ${dataset.distribution} --seed ${dataset.seed} --chunk-mib ${dataset.generator_chunk_mib} "${legacy_args[@]}"
    variants:
      blocksize:
        artifacts:
          X:
            path: systemds/X-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.rows}", cols: "${dataset.cols}", rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
          binary_y:
            path: systemds/binary_y-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.rows}", cols: 1, rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
          nn_y:
            path: systemds/nn_y-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.rows}", cols: 1, rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
        prepare:
          policy: auto
          command: |
            prep_root="${dataset.dir}/.sysds-root-bs${run.blocksize}"
            mkdir -p "$prep_root/target" "$prep_root/conf" "${dataset.dir}/tmp/prepare-bs${run.blocksize}" "${dataset.dir}/scratch/prepare-bs${run.blocksize}" "${dataset.dir}/tmp/java"
            ln -sfn "${tools.systemds_jar}" "$prep_root/target/SystemDS.jar"
            if [ -d "$(dirname "${tools.systemds_jar}")/lib" ]; then
              ln -sfn "$(dirname "${tools.systemds_jar}")/lib" "$prep_root/target/lib"
            fi
            cat > "$prep_root/conf/SystemDS-config.xml" <<EOF
            <root>
              <sysds.localtmpdir>${dataset.dir}/tmp/prepare-bs${run.blocksize}</sysds.localtmpdir>
              <sysds.scratch>${dataset.dir}/scratch/prepare-bs${run.blocksize}</sysds.scratch>
              <sysds.defaultblocksize>${run.blocksize}</sysds.defaultblocksize>
            </root>
            EOF
            # 8g, raised from 3g: the reblock is itself an OOC job, and at blocksize 1000 each
            # block is 8MB against 2MB at 500. 3g survived the 16GB datasets and OOMed
            # assembling X-bs1000 for the 32GB ones. Prepare runs outside the run cgroups.
            SYSTEMDS_ROOT="$prep_root" JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=${plan.root}/tmp/java" "${tools.python}" "${plan.dir}/prepare_dense_systemds.py" "${dataset.dir}" --rows ${dataset.rows} --cols ${dataset.cols} --blocksize ${run.blocksize} --chunk-mib ${dataset.systemds_chunk_mib} --java "${tools.java}" --systemds-jar "${tools.systemds_jar}" --config "$prep_root/conf/SystemDS-config.xml" --java-heap 8g --java-tmp "${plan.root}/tmp/java" --replace-invalid --x-output "${dataset.dir}/systemds/X-bs${run.blocksize}" --binary-y-output "${dataset.dir}/systemds/binary_y-bs${run.blocksize}" --nn-y-output "${dataset.dir}/systemds/nn_y-bs${run.blocksize}"
      # The Dask arm's counterpart to the native SystemDS blocksize: an uncompressed
      # Zarr store of X, prepared outside the timed scope exactly like X-bs<blocksize>.
      # It is baseline_only because Dask and NumPy run in the single -baseline case that
      # carries no SystemDS blocksize. Only X is converted: the response vectors are one
      # column wide and are read eagerly as NumPy, so chunking them would add thousands
      # of kilobyte-sized tasks to every graph for a 32 MB operand.
      dask_chunk:
        baseline_only: true
        artifacts:
          X_zarr:
            path: zarr/X.zarr
            metadata:
              path: zarr/X.zarr.json
              expect:
                {rows: "${dataset.rows}", cols: "${dataset.cols}",
                 row_chunk: "${run.dask_chunk}", col_chunk: "${dataset.cols}",
                 dtype: float64, compressor: none,
                 generator: prepare_zarr.py, generator_version: 1}
        prepare:
          policy: auto
          command: |
            "${tools.python}" "${plan.dir}/prepare_zarr.py" "${dataset.dir}/X.f64" "${dataset.dir}/zarr/X.zarr" --rows ${dataset.rows} --cols ${dataset.cols} --row-chunk ${run.dask_chunk} --chunk-mib ${dataset.systemds_chunk_mib} --replace-invalid

  # This definition consumes no space until an enabled run references dense_2m.
  dense_2m:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-2m
    parameters:
      {rows: 2000000, cols: 1024, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 17, generator_chunk_mib: 256, accept_legacy: false,
       systemds_chunk_mib: 128}

  # Aligned synthetic scaling series. None of these consume space until a run
  # selects dense_scaling below (or names an instance directly).
  dense_d4:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d4
    parameters:
      {rows: 500000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 101, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  dense_d8:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d8
    parameters:
      {rows: 1000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 102, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  dense_d16:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d16
    parameters:
      {rows: 2000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 103, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  dense_d32:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/dense-d32
    parameters:
      {rows: 4000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 104, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  gnmf_1m:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/gnmf
    parameters:
      {rows: 1000000, cols: 384, classes: 2, sparsity: 1.0,
       distribution: uniform_nonnegative, seed: 23, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  # GNMF requires nonnegative inputs, so its scaling series matches the dense
  # sweep's byte sizes and geometry without reusing invalid normal data.
  gnmf_d4:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/gnmf-d4
    parameters:
      {rows: 500000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: uniform_nonnegative, seed: 201, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  gnmf_d8:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/gnmf-d8
    parameters:
      {rows: 1000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: uniform_nonnegative, seed: 202, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  gnmf_d16:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/gnmf-d16
    parameters:
      {rows: 2000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: uniform_nonnegative, seed: 203, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  gnmf_d32:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/gnmf-d32
    parameters:
      {rows: 4000000, cols: 1000, classes: 2, sparsity: 1.0,
       distribution: uniform_nonnegative, seed: 204, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  # Wide-hidden-layer MLP. 2.15 GB of input against a first-layer model of up to
  # 10.5 GB -- the one workload here where the object that does not fit is the
  # *model*, not the data or an activation. That distinction is what makes it
  # worth running: activation checkpointing, the technique the deep-learning
  # stack standardised on for memory pressure, has nothing to recompute when the
  # parameters are the problem, and sharding it across devices is unavailable on
  # a single node. Jankov et al. (VLDB 2019) report TensorFlow crashing above
  # 40,000 hidden units on a 60,000-feature input; the geometry here is scaled to
  # a single-node disk budget but keeps the same ratio of model to memory.
  #
  # 16,384 columns rather than 60,000 because the model is D*H and three copies
  # of it must be live: at D = 60,000 and H = 80,000 the scratch requirement
  # alone would be 115 GB before any engine overhead.
  mlp_wide:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/mlp-wide
    parameters:
      {rows: 16384, cols: 16384, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 29, generator_chunk_mib: 128,
       accept_legacy: false, systemds_chunk_mib: 128}

  # Exact kernel ridge regression. 51 MB of input, a Gram matrix of 1.25 / 5.0 /
  # 20.0 GB at the three sizes in `krr_size` -- by far the widest input-to-
  # intermediate ratio in the suite, and the reason random Fourier features
  # (random_features/) exist at all. Running both makes the approximation and the
  # exact method a matched pair rather than two unrelated workloads.
  #
  # 128 columns matches rf_1m so the two share a feature dimension, and keeps the
  # kernel build traffic-dominated: 2*n^2*d flops against 8*n^2 bytes is 32 flops
  # per byte, a quarter of knn's ratio at 512 columns.
  krr_50k:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/krr-50k
    parameters:
      {rows: 50000, cols: 128, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 47, generator_chunk_mib: 128,
       accept_legacy: false, systemds_chunk_mib: 128}

  randomforest_1m:
    directory: ${plan.root}/bench-data/randomforest
    parameters:
      {rows: 1000000, cols: 64, classes: 2, bins: 8, sparsity: 1.0,
       distribution: normal, seed: 7, generator_chunk_mib: 256, accept_legacy: false,
       systemds_chunk_mib: 128}
    ready: [randomforest-metadata.json]
    artifacts:
      X_binned_raw:
        path: X_binned.u8
        size_bytes_product: ["${dataset.rows}", "${dataset.cols}"]
        metadata:
          path: randomforest-metadata.json
          expect:
            {rows: "${dataset.rows}", cols: "${dataset.cols}", bins: "${dataset.bins}",
             dtype: uint8, generator: prepare_randomforest_dataset.py,
             generator_version: 1}
      class_y_raw: {path: class_y.u8, size_bytes_product: ["${dataset.rows}"]}
    prepare:
      policy: auto
      clean:
        [X.f64, X.f64.json, binary_y.f64, nn_y.f64, metadata.json,
         X_binned.u8, class_y.u8, randomforest-metadata.json, systemds]
      command: |
        set -euo pipefail
        legacy_args=()
        if [ "${dataset.accept_legacy}" = true ]; then legacy_args+=(--accept-legacy); fi
        "${tools.python}" "${plan.dir}/prepare_dense_dataset.py" --out "${dataset.dir}" --rows ${dataset.rows} --cols ${dataset.cols} --classes ${dataset.classes} --sparsity ${dataset.sparsity} --distribution ${dataset.distribution} --seed ${dataset.seed} --chunk-mib ${dataset.generator_chunk_mib} "${legacy_args[@]}"
        "${tools.python}" "${plan.dir}/prepare_randomforest_dataset.py" --out "${dataset.dir}" --rows ${dataset.rows} --cols ${dataset.cols} --bins ${dataset.bins} --chunk-mib ${dataset.generator_chunk_mib}
    variants:
      blocksize:
        artifacts:
          X:
            path: systemds/X_binned-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.rows}", cols: "${dataset.cols}", rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
          y:
            path: systemds/class_y-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.rows}", cols: 1, rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
        prepare:
          policy: auto
          clean:
            ["systemds/X_binned-bs${run.blocksize}",
             "systemds/X_binned-bs${run.blocksize}.mtd",
             "systemds/.X_binned-bs${run.blocksize}.mtd.crc",
             "systemds/class_y-bs${run.blocksize}",
             "systemds/class_y-bs${run.blocksize}.mtd",
             "systemds/.class_y-bs${run.blocksize}.mtd.crc",
             "systemds/systemds-staging/X_binned-bs${run.blocksize}-bs${run.blocksize}",
             "systemds/systemds-staging/class_y-bs${run.blocksize}-bs${run.blocksize}"]
          command: |
            set -euo pipefail
            prep_root="${dataset.dir}/.sysds-root-randomforest-bs${run.blocksize}"
            mkdir -p "$prep_root/target" "$prep_root/conf" "${dataset.dir}/tmp/randomforest-bs${run.blocksize}" "${dataset.dir}/scratch/randomforest-bs${run.blocksize}" "${dataset.dir}/tmp/java"
            ln -sfn "${tools.systemds_jar}" "$prep_root/target/SystemDS.jar"
            if [ -d "$(dirname "${tools.systemds_jar}")/lib" ]; then
              ln -sfn "$(dirname "${tools.systemds_jar}")/lib" "$prep_root/target/lib"
            fi
            cat > "$prep_root/conf/SystemDS-config.xml" <<EOF
            <root>
              <sysds.localtmpdir>${dataset.dir}/tmp/randomforest-bs${run.blocksize}</sysds.localtmpdir>
              <sysds.scratch>${dataset.dir}/scratch/randomforest-bs${run.blocksize}</sysds.scratch>
              <sysds.defaultblocksize>${run.blocksize}</sysds.defaultblocksize>
            </root>
            EOF
            SYSTEMDS_ROOT="$prep_root" "${tools.python}" "${plan.dir}/convert_fp64_systemds.py" "${dataset.dir}/X_binned.u8" "${dataset.dir}/systemds/X_binned-bs${run.blocksize}" --rows ${dataset.rows} --cols ${dataset.cols} --dtype uint8 --blocksize ${run.blocksize} --chunk-mib ${dataset.systemds_chunk_mib} --java "${tools.java}" --systemds-jar "${tools.systemds_jar}" --config "$prep_root/conf/SystemDS-config.xml" --java-heap 3g --java-tmp "${dataset.dir}/tmp/java" --replace-invalid
            SYSTEMDS_ROOT="$prep_root" "${tools.python}" "${plan.dir}/convert_fp64_systemds.py" "${dataset.dir}/class_y.u8" "${dataset.dir}/systemds/class_y-bs${run.blocksize}" --rows ${dataset.rows} --cols 1 --dtype uint8 --blocksize ${run.blocksize} --chunk-mib ${dataset.systemds_chunk_mib} --java "${tools.java}" --systemds-jar "${tools.systemds_jar}" --config "$prep_root/conf/SystemDS-config.xml" --java-heap 3g --java-tmp "${dataset.dir}/tmp/java" --replace-invalid

  als_1m:
    directory: ${plan.root}/bench-data/als
    parameters: {users: 1000000, items: 100000, ratings_per_user: 40, nnz: 40000000, seed: 19}
    ready: [metadata.json]
    artifacts:
      row_ptr:
        path: csr/row_ptr.i64
        size_bytes_from_metadata: {path: metadata.json, key: rows, multiplier: 8, add: 8}
      col_idx: {path: csr/col_idx.i32, size_bytes_product: ["${dataset.nnz}", 4]}
      values: {path: csr/values.f64, size_bytes_product: ["${dataset.nnz}", 8]}
    prepare:
      policy: auto
      command: |
        "${tools.python}" "${plan.dir}/prepare_als_dataset.py" --out "${dataset.dir}" --users ${dataset.users} --items ${dataset.items} --ratings-per-user ${dataset.ratings_per_user} --seed ${dataset.seed}
    variants:
      blocksize:
        artifacts:
          X:
            path: systemds/X-bs${run.blocksize}
            metadata:
              expect: {rows: "${dataset.users}", cols: "${dataset.items}", nnz: "${dataset.nnz}", rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}
        prepare:
          policy: auto
          command: |
            set -euo pipefail
            prep_root="${dataset.dir}/.sysds-root-bs${run.blocksize}"
            classes="$prep_root/classes"
            sysds_cp="${tools.systemds_jar}:$(dirname "${tools.systemds_jar}")/lib/*"
            mkdir -p "$classes" "${dataset.dir}/systemds" "${dataset.dir}/tmp/java"
            java_bin="$(command -v "${tools.java}")"
            javac_bin="$(dirname "$java_bin")/javac"
            "$javac_bin" -cp "$sysds_cp" -d "$classes" "${plan.dir}/ALSCSRToSystemDS.java"
            native_x="${dataset.dir}/systemds/X-bs${run.blocksize}"
            staging_x="${dataset.dir}/systemds/.X-bs${run.blocksize}.tmp-$$"
            mkdir -p "$staging_x"
            "${tools.java}" -Xmx1g -Djava.io.tmpdir="${dataset.dir}/tmp/java" -cp "$classes:$sysds_cp" ALSCSRToSystemDS "${dataset.dir}/csr" "$staging_x/part-00000" ${dataset.users} ${dataset.items} ${run.blocksize} ${dataset.nnz}
            invalid_stamp="$(date +%Y%m%dT%H%M%S)"
            if [ -e "$native_x" ]; then mv "$native_x" "$native_x.invalid-$invalid_stamp"; fi
            if [ -e "$native_x.mtd" ]; then mv "$native_x.mtd" "$native_x.mtd.invalid-$invalid_stamp"; fi
            mv "$staging_x" "$native_x"
            cat > "$native_x.mtd" <<EOF
            {
              "data_type": "matrix",
              "value_type": "double",
              "rows": ${dataset.users},
              "cols": ${dataset.items},
              "nnz": ${dataset.nnz},
              "format": "binary",
              "rows_in_block": ${run.blocksize},
              "cols_in_block": ${run.blocksize}
            }
            EOF

  twitter_400k:
    directory: ${plan.root}/bench-data/twitter-2010
    parameters:
      {vertices: 41652230, edges: 1468365182, blocksize: 400000,
       seed: deterministic-affine-104729-12345, prepare_workers: 16,
       prepare_concurrency: 6}
    ready: [metadata.json]
    artifacts:
      G:
        path: systemds/G
        metadata:
          expect:
            {rows: "${dataset.vertices}", cols: "${dataset.vertices}", nnz: "${dataset.edges}",
             rows_in_block: "${dataset.blocksize}", cols_in_block: "${dataset.blocksize}"}
      dangling:
        path: systemds/dangling
        metadata:
          expect: {rows: "${dataset.vertices}", rows_in_block: "${dataset.blocksize}"}
      csr_row_ptr:
        path: csr/row_ptr.i64
        size_bytes_from_metadata: {path: metadata.json, key: vertices, multiplier: 8, add: 8}
      csr_col_idx:
        path: csr/col_idx.i32
        size_bytes_from_metadata: {path: metadata.json, key: edges, multiplier: 4}
      csr_values:
        path: csr/values.f64
        size_bytes_from_metadata: {path: metadata.json, key: edges, multiplier: 8}
        metadata:
          path: metadata.json
          expect: {vertices: "${dataset.vertices}", edges: "${dataset.edges}"}
      dangling_raw:
        path: dangling.u8
        size_bytes_from_metadata: {path: metadata.json, key: vertices}
    prepare:
      policy: auto
      clean: [systemds/G, systemds/G.mtd, systemds/dangling, systemds/dangling.mtd]
      env:
        PYTHON: ${tools.python}
        SYSDS_JAR: ${tools.systemds_jar}
        BENCH_DATA_DIR: ${plan.root}/bench-data
        REAL_WORLD_BLOCKSIZE: ${dataset.blocksize}
        REAL_WORLD_NATIVE_SUFFIX: ""
        PREP_WORKERS: ${dataset.prepare_workers}
        PREP_CONCURRENCY: ${dataset.prepare_concurrency}
        PREP_JAVA_HEAP: 2g
      command: >-
        ../experiments/real_world/prepare.sh twitter-2010 "${dataset.dir}"

  # Intermediate-bound pair. Both datasets are small enough to sit in memory at
  # every profile; what does not fit is what the algorithm builds from them, so
  # these two say something the input-bound sweeps above cannot. They are also
  # nearly free on disk -- together under 2 GB of raw plus their prepared copies,
  # against 96 GB for one dense instance -- because the large object of each run
  # is never stored at all.

  # Random Fourier features: 1.02 GB of input, a feature map of 4.1 / 8.2 / 16.4 /
  # 32.8 GB at the four widths in `rf_width`. 128 columns keeps the projection
  # itself trivial while leaving the map's width free to scale.
  rf_1m:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/rf-1m
    parameters:
      {rows: 1000000, cols: 128, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 41, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  # Brute-force kNN: 819 MB of input, a query-by-reference distance matrix of
  # 4.0 / 8.0 / 16.0 / 32.0 GB at the four reference sizes in `knn_reference`.
  # 200,000 rows leaves the 25,000-row query block clear of the largest reference
  # block, and every boundary the run slices at -- 20,000 / 40,000 / 80,000 /
  # 160,000 and the query start at 175,000 -- is a multiple of the 5,000-row Dask
  # chunk, so no arm reads a partial chunk.
  knn_200k:
    <<: *dense_dataset
    directory: ${plan.root}/bench-data/knn-200k
    parameters:
      {rows: 200000, cols: 512, classes: 2, sparsity: 1.0,
       distribution: normal, seed: 43, generator_chunk_mib: 256,
       accept_legacy: false, systemds_chunk_mib: 128}

  # Sparse symmetric graph for connected components, stored as CSR over raw files exactly
  # like `pagerank/`. Twelve bytes per stored edge -- a 4-byte column index and an 8-byte
  # value -- which is also what a SystemDS SparseBlockCSR costs, so the arms read comparable
  # volume instead of being separated by their representations. The all-ones value array
  # carries no information but is written and read anyway: SystemDS has no unweighted matrix
  # type and must read it, and dropping it would cut the Dask arm's input by two thirds.
  #
  # `band` sets degree, and so dataset size at a fixed vertex count; the power-of-two offset
  # ladder above it sets diameter, and so the propagation-pass count. Unlike a dense
  # adjacency the two are independent here, which is the main reason this workload is sparse.
  #
  # Density is 1.47%, which is set by the blocksize rather than chosen freely. SystemDS's OOC
  # engine budgets every tile with `estimateSizeDenseInMemory(blen, blen)` -- dense, whatever
  # the data's actual sparsity -- against a limit of min(heap/9, 1 GiB). That caps the
  # blocksize at 5,181 outright and at 2,991 for the mem4 profile's 3g heap. A block therefore
  # holds at most ~2,991^2 cells, and for it to carry a megabyte of stored edges the graph
  # cannot be sparser than about 1%. At 1.47% and blocksize 2,500 each block holds 1.05 MiB.
  # The four instances are 4.0 / 8.0 / 16.1 / 31.8 GB.
  cc_d4: &cc_dataset
    directory: ${plan.root}/bench-data/cc-d4
    parameters:
      {vertices: 150000, components: 4, band: 1107, minority_fraction: 0.015, seed: 7,
       generator_chunk_mib: 256, systemds_chunk_mib: 128}
    ready: [metadata.json]
    artifacts:
      row_ptr:
        path: csr/row_ptr.i64
        size_bytes_from_metadata: {path: metadata.json, key: vertices, multiplier: 8, add: 8}
        metadata:
          path: metadata.json
          expect:
            {vertices: "${dataset.vertices}", components: "${dataset.components}",
             band: "${dataset.band}", minority_fraction: "${dataset.minority_fraction}",
             seed: "${dataset.seed}",
             generator: connected_components/prepare.py, generator_version: 1}
      col_idx:
        path: csr/col_idx.i32
        size_bytes_from_metadata: {path: metadata.json, key: edge_slots, multiplier: 4}
      values:
        path: csr/values.f64
        size_bytes_from_metadata: {path: metadata.json, key: edge_slots, multiplier: 8}
    prepare:
      policy: auto
      command: |
        "${tools.python}" "${plan.dir}/connected_components/prepare.py" --out "${dataset.dir}" --vertices ${dataset.vertices} --components ${dataset.components} --band ${dataset.band} --minority-fraction ${dataset.minority_fraction} --seed ${dataset.seed} --chunk-mib ${dataset.generator_chunk_mib}
    variants:
      # Only SystemDS needs a converted representation. Dask reads the canonical CSR
      # directly: row bands are already its natural chunking of that layout, so its tuning
      # knob is the runtime `band_rows` parameter rather than a prepared artifact. There is
      # no Zarr variant here for the same reason -- Zarr stores dense arrays, and the whole
      # point of this dataset is that the graph never exists densely.
      blocksize:
        artifacts:
          G:
            path: systemds/G-bs${run.blocksize}
            metadata: {expect: {rows: "${dataset.vertices}", cols: "${dataset.vertices}", rows_in_block: "${run.blocksize}", cols_in_block: "${run.blocksize}"}}
        prepare:
          policy: auto
          command: |
            prep_root="${dataset.dir}/.sysds-root-bs${run.blocksize}"
            mkdir -p "$prep_root/target" "$prep_root/conf" "${dataset.dir}/tmp/prepare-bs${run.blocksize}" "${dataset.dir}/scratch/prepare-bs${run.blocksize}" "${dataset.dir}/tmp/java"
            ln -sfn "${tools.systemds_jar}" "$prep_root/target/SystemDS.jar"
            if [ -d "$(dirname "${tools.systemds_jar}")/lib" ]; then
              ln -sfn "$(dirname "${tools.systemds_jar}")/lib" "$prep_root/target/lib"
            fi
            cat > "$prep_root/conf/SystemDS-config.xml" <<EOF
            <root>
              <sysds.localtmpdir>${dataset.dir}/tmp/prepare-bs${run.blocksize}</sysds.localtmpdir>
              <sysds.scratch>${dataset.dir}/scratch/prepare-bs${run.blocksize}</sysds.scratch>
              <sysds.defaultblocksize>${run.blocksize}</sysds.defaultblocksize>
            </root>
            EOF
            # Sparse transfer, so prepare_sparse_systemds.py rather than the dense converter:
            # a single row band of this graph would be terabytes if materialized densely.
            # 8g for the same reason as the dense datasets -- the reblock is itself an OOC
            # job, and preparation runs outside the run cgroups.
            SYSTEMDS_ROOT="$prep_root" JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=${plan.root}/tmp/java" "${tools.python}" "${plan.dir}/prepare_sparse_systemds.py" "${dataset.dir}" "${dataset.dir}/systemds/G-bs${run.blocksize}" --blocksize ${run.blocksize} --chunk-mib ${dataset.systemds_chunk_mib} --java "${tools.java}" --systemds-jar "${tools.systemds_jar}" --config "$prep_root/conf/SystemDS-config.xml" --java-heap 8g --java-tmp "${plan.root}/tmp/java" --replace-invalid

  cc_d8:
    <<: *cc_dataset
    directory: ${plan.root}/bench-data/cc-d8
    parameters:
      {vertices: 212500, components: 4, band: 1570, minority_fraction: 0.015, seed: 17,
       generator_chunk_mib: 256, systemds_chunk_mib: 128}

  cc_d16:
    <<: *cc_dataset
    directory: ${plan.root}/bench-data/cc-d16
    parameters:
      {vertices: 302500, components: 4, band: 2237, minority_fraction: 0.015, seed: 27,
       generator_chunk_mib: 256, systemds_chunk_mib: 128}

  cc_d32:
    <<: *cc_dataset
    directory: ${plan.root}/bench-data/cc-d32
    parameters:
      {vertices: 425000, components: 4, band: 3145, minority_fraction: 0.015, seed: 37,
       generator_chunk_mib: 256, systemds_chunk_mib: 128}

dataset_groups:
  # 32 GB instances: at 16 GB the data barely exceeded the largest budget, and the
  # per-JVM warmup (~15s, measured) was 65-78% of an OOC run. Doubling the data makes
  # data:memory the real variable and shrinks the fixed cost to a proportionate term
  # without warming any cache the measurement depends on.
  dense_scaling: [dense_d32] #[dense_d4, dense_d8, dense_d16, dense_d32]
  gnmf_scaling: [gnmf_d32] #[gnmf_d4, gnmf_d8, gnmf_d16, gnmf_d32]
  dense_legacy_scaling: [dense_2m] #[dense_1m, dense_2m]
  # 150,000 / 212,500 / 302,500 / 425,000 vertices at density 1.47% are 4.0 / 8.0 /
  # 16.1 / 31.8 GB of CSR. Every one is an exact multiple of both the 2,500 SystemDS
  # blocksize and the 500-row Dask band.
  cc_scaling: [cc_d32] #[cc_d4, cc_d8, cc_d16, cc_d32]

systemds_setup: &systemds_setup
  command: |
    mkdir -p "${run.results}/systemds-tmp" "${run.results}/systemds-scratch" "${run.results}/spark-local" "${run.results}/java-tmp"
    cat > "${run.results}/SystemDS-config.xml" <<EOF
    <root>
      <sysds.localtmpdir>${run.results}/systemds-tmp</sysds.localtmpdir>
      <sysds.scratch>${run.results}/systemds-scratch</sysds.scratch>
      <sysds.defaultblocksize>${run.blocksize}</sysds.defaultblocksize>
      <!--<sysds.native.blas>openblas</sysds.native.blas>-->
    </root>
    EOF

runs:
  # OOC and local Spark blocksize candidates are independent. Each sweep creates
  # backend-specific cases; ungrouped Python/Dask implementations run once in a
  # separate <run-id>-baseline case.
  - id: pagerank_3g
    enabled: false
    dataset: twitter_400k
    resource_profiles: {group: scaling}
    entrypoint: ${plan.dir}/pagerank/systemds.dml
    blocksize_sweeps: {ooc: [400000], spark: [400000]}
    parameters:
      iterations: 15
      alpha: 0.85
      systemds_args: >-
        -args "${input.G}" "${input.dangling}" ${run.alpha} ${run.iterations}
        "${run.outputs}/systemds-r${rep}"
    inputs: {G: {artifact: G}, dangling: {artifact: dangling}}
    resources: {timeout_seconds: 3600, timeout_grace_seconds: 30}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: scipy-csr-memmap
        template: python
        required_python_modules: [numpy, scipy]
        command: >-
          "${tools.python}" "${plan.dir}/pagerank/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations} --alpha ${run.alpha}
          --output "${run.outputs}/scipy-r${rep}.npy"

  - id: multilogreg_scaling
    enabled: true
    dataset: {group: dense_scaling}
    resource_profiles: {group: scaling}
    entrypoint: ${plan.dir}/multilogreg/systemds.dml
    blocksize_sweeps: {ooc: [500, 1000], spark: [1000]}
    parameters:
      # Row chunk for the prepared Zarr store: 95 MiB at 1000 columns, inside Dask's
      # ~100 MiB guidance, and an exact divisor of every dense dataset so no trailing
      # chunk is padded. Full-width rows, not square tiles: every kernel here is a
      # row-local reduction, and splitting columns forces a combine none of them ask for.
      dask_chunk: 12500
      # Raised from 1/1: one outer and one inner step is a single gradient step, not
      # multinomial logistic regression. TRON costs roughly outer*(2+2*inner) passes
      # over X, so 1/1 was 4 passes and 5/10 would be 110 -- 3/5 gives 36, a real fit
      # that keeps the case inside a sane timeout at 32 GB.
      iterations: 3
      inner_iterations: 5
      tolerance: 1e-8
      reg: 1.0
      systemds_args: >-
        -args "${input.X}" "${input.y}" ${run.tolerance} ${run.reg}
        ${run.iterations} ${run.inner_iterations} "${run.outputs}/systemds-r${rep}"
    inputs: {X: {artifact: X}, y: {artifact: binary_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: numpy-tron
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/multilogreg/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations} --inner-iterations ${run.inner_iterations}
          --tolerance ${run.tolerance} --reg ${run.reg}
          --output "${run.outputs}/python-r${rep}.json"

      - id: dask-tron
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/multilogreg/dask_array.py" "${dataset.dir}"
          --iterations ${run.iterations} --inner-iterations ${run.inner_iterations}
          --tolerance ${run.tolerance} --reg ${run.reg} --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  - id: randomized_svd_scaling
    enabled: true
    dataset: {group: dense_scaling}
    resource_profiles: {group: scaling}
    entrypoint: ${plan.dir}/randomized_svd/systemds.dml
    blocksize_sweeps: {ooc: [500, 1000], spark: [1000]}
    parameters:
      # Row chunk for the prepared Zarr store: 95 MiB at 1000 columns, inside Dask's
      # ~100 MiB guidance, and an exact divisor of every dense dataset so no trailing
      # chunk is padded. Full-width rows, not square tiles: every kernel here is a
      # row-local reduction, and splitting columns forces a combine none of them ask for.
      dask_chunk: 12500
      rank: 16
      seed: 31
      systemds_args: >-
        -args "${input.X}" ${run.rank} ${run.seed}
        "${run.outputs}/systemds-S-r${rep}" "${run.outputs}/systemds-V-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 900}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: numpy-two-pass
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/randomized_svd/numpy.py" "${dataset.dir}"
          --rank ${run.rank} --seed ${run.seed} --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-two-pass
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/randomized_svd/dask_array.py" "${dataset.dir}"
          --rank ${run.rank} --seed ${run.seed} --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # Wide-hidden-layer MLP: the model is what does not fit.
  #
  # Both baselines were rewritten for this geometry. Holding W1 as an ordinary
  # in-RAM array would have them fail on the first allocation, which measures
  # nothing, so numpy/ keeps the weights, gradient and velocity in np.memmap and
  # dask_array/ double-buffers them through Zarr stores. Those are the strongest
  # single-node formulations available without a training framework, which is
  # what makes the comparison one of I/O efficiency rather than of allocation
  # strategy.
  #
  # One epoch of 16 batches. The claim is about model scale, not convergence;
  # raise `rows` for a longer run at 1.0 GB of raw input per 8,192 rows.
  - id: mlp_wide_scaling
    enabled: false
    dataset: mlp_wide
    resource_profiles: {group: scaling}
    parameter_cases: mlp_hidden
    entrypoint: ${plan.dir}/mlp/systemds.dml
    blocksize_sweeps: {ooc: [500], spark: [1000]}
    parameters:
      # 512 rows is 67 MB at 16,384 columns and divides the dataset exactly,
      # giving 32 chunks. Sized on the input rather than the activation because
      # at these hidden widths the activation is chunked on its own axis.
      dask_chunk: 512
      # Column chunk for the (D, H) parameter stores: 2,048 columns is 268 MB at
      # 16,384 rows and divides every width in `mlp_hidden`.
      hidden_chunk: 2048
      epochs: 1
      batch_size: 1024
      learning_rate: 0.003
      seed: 7
      systemds_args: >-
        -args "${input.X}" "${input.y}" ${run.batch_size} ${run.epochs}
        ${run.learning_rate} ${run.seed} ${run.hidden_size}
        "${run.outputs}/systemds-W1-r${rep}" "${run.outputs}/systemds-W2-r${rep}"
    inputs: {X: {artifact: X}, y: {artifact: nn_y}}
    resources: {timeout_seconds: 3600}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: numpy-minibatch
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/mlp/numpy.py" "${dataset.dir}"
          --epochs ${run.epochs} --batch-size ${run.batch_size}
          --hidden-size ${run.hidden_size} --learning-rate ${run.learning_rate} --seed ${run.seed}
          --output "${run.outputs}/python-r${rep}.json"
      - id: dask-minibatch
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/mlp/dask_array.py" "${dataset.dir}"
          --epochs ${run.epochs} --batch-size ${run.batch_size}
          --hidden-size ${run.hidden_size} --hidden-chunk ${run.hidden_chunk}
          --learning-rate ${run.learning_rate} --seed ${run.seed}
          --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # Exact kernel ridge regression: the intermediate is revisited, not consumed.
  #
  # knn/ builds its distance matrix once and rewrites it k times. Here the Gram
  # matrix is loop-invariant and every one of the 20 CG iterations re-reads it in
  # full -- 400 GB of traffic at krr16 against a 51 MB input. That is the pattern
  # that separates an engine which keeps a disk-resident operand from one which
  # recomputes it on demand, and both baselines expose the choice explicitly so
  # the gap is measured rather than assumed.
  - id: kernel_ridge_scaling
    enabled: false
    dataset: krr_50k
    resource_profiles: {group: scaling}
    parameter_cases: krr_size
    entrypoint: ${plan.dir}/kernel_ridge/systemds.dml
    blocksize_sweeps: {ooc: [500], spark: [1000]}
    parameters:
      # 2,500 rows is 2.6 MB of input but 50 MB of Gram matrix once squared onto
      # the columns, and divides all three sizes in `krr_size` exactly.
      dask_chunk: 2500
      gamma: 0.01
      reg: 1.0
      cg_iterations: 20
      systemds_args: >-
        -args "${input.X}" "${input.nn_y}" ${run.train_rows} ${run.gamma}
        ${run.reg} ${run.cg_iterations} "${run.outputs}/systemds-alpha-r${rep}"
    inputs: {X: {artifact: X}, nn_y: {artifact: nn_y}}
    resources: {timeout_seconds: 3600}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      # In-RAM Gram matrix, which is what sklearn.kernel_ridge builds and what
      # knn/numpy.py does. Expected to be OOM-killed above the profile's limit;
      # add --kernel-memmap for the disk-backed formulation and report the
      # stronger of the two.
      - id: numpy-kernel-ridge
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/kernel_ridge/numpy.py" "${dataset.dir}"
          --train-rows ${run.train_rows} --gamma ${run.gamma} --reg ${run.reg}
          --cg-iterations ${run.cg_iterations} --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-kernel-ridge
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/kernel_ridge/dask_array.py" "${dataset.dir}"
          --train-rows ${run.train_rows} --gamma ${run.gamma} --reg ${run.reg}
          --cg-iterations ${run.cg_iterations} --chunk-rows ${run.dask_chunk}
          --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  - id: gnmf_scaling
    enabled: false
    dataset: {group: gnmf_scaling}
    resource_profiles: {group: scaling}
    entrypoint: ${plan.dir}/gnmf/systemds.dml
    blocksize_sweeps: {ooc: [500, 1000], spark: [1000]}
    parameters:
      # Row chunk for the prepared Zarr store: 95 MiB at 1000 columns, inside Dask's
      # ~100 MiB guidance, and an exact divisor of every dense dataset so no trailing
      # chunk is padded. Full-width rows, not square tiles: every kernel here is a
      # row-local reduction, and splitting columns forces a combine none of them ask for.
      dask_chunk: 12500
      rank: 16
      # raised from 2: multiplicative updates conventionally run 50-200; 20 is a floor.
      iterations: 20
      epsilon: 1e-8
      seed: 23
      systemds_args: >-
        -args "${input.X}" ${run.rank} ${run.iterations} ${run.epsilon} ${run.seed}
        "${run.outputs}/systemds-W-r${rep}" "${run.outputs}/systemds-H-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
