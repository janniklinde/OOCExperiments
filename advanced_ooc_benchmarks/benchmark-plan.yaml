        command: >-
          "${tools.python}" "${plan.dir}/kmeans/dask_array.py" "${dataset.dir}"
          --clusters ${run.clusters} --iterations ${run.iterations}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # ---------------------------------------------------------------------------
  # Phase 4 -- data shape
  #
  # 32 GB and a 16 GB budget throughout, geometry the only variable. The tall
  # axis contains 40M x 100 and 400M x 10; both are single-column-block inputs
  # at blen 1000, while the latter exposes the cost of ten-times more small blocks.
  # The wide 40k x 100k case remains the multi-column-block counterpart below.
  # ---------------------------------------------------------------------------
  # 40M x 100.
  - id: lmcg_tall
    dataset: {group: dense_tall}
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/lmcg/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: ${dataset.dask_chunk}
      iterations: 10
      reg: 1e-7
      tolerance: 0.0
      systemds_args: >-
        -args "${input.X}" "${input.y}" ${run.reg} ${run.iterations} ${run.tolerance}
        "${run.outputs}/systemds-beta-r${rep}"
    inputs: {X: {artifact: X}, y: {artifact: binary_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      - id: numpy-cg
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/lmcg/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations} --reg ${run.reg} --tolerance ${run.tolerance}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-cg
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/lmcg/dask_array.py" "${dataset.dir}"
          --iterations ${run.iterations} --reg ${run.reg} --tolerance ${run.tolerance}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # 40M x 100.
  - id: kmeans_tall
    dataset: {group: dense_tall}
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/kmeans/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: ${dataset.dask_chunk}
      clusters: 32
      iterations: 10
      systemds_args: >-
        -args "${input.X}" ${run.clusters} ${run.iterations}
        "${run.outputs}/systemds-centers-r${rep}"
        "${run.outputs}/systemds-labels-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      - id: sklearn-minibatch
        template: python
        required_python_modules: [numpy, sklearn]
        command: >-
          "${tools.python}" "${plan.dir}/kmeans/sklearn_batching.py" "${dataset.dir}"
          --clusters ${run.clusters} --passes ${run.iterations}
          --batch-rows ${run.dask_chunk}
          --output "${run.outputs}/sklearn-r${rep}.json"
      - id: dask-lloyd
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/kmeans/dask_array.py" "${dataset.dir}"
          --clusters ${run.clusters} --iterations ${run.iterations}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # ---------------------------------------------------------------------------
  # Phase 5 -- intermediate size
  #
  # kNN's cost is set by the materialised distance matrix rather than by the input;
  # its series continues the phase-1 anchor without repeating the smallest case.
  # The GNMF case below complements it with several simultaneously large factor/update
  # matrices and iterative reuse rather than a single traffic-dominated intermediate.
  # ---------------------------------------------------------------------------
  # Distance matrix 8.0 / 16.0 / 32.0 GB.
  - id: knn_size
    dataset: knn_200k
    resource_profiles: [mem16]
    parameter_cases: knn_rest
    entrypoint: ${plan.dir}/knn/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      # The distance matrix is chunk x chunk, so this row count sets the output tile
      # rather than the 512-column input band: 2,500 rows is a 50 MiB tile, where the
      # 5,000 that slice alignment also permits would be 200 MiB and spill at 64 threads.
      # Chunks must divide every boundary this run slices at, whose gcd with the row
      # count is 5,000, leaving 2,500 as the largest tile inside the 100 MiB target.
      dask_chunk: 2500
      query_rows: 25000
      neighbours: 5
      systemds_args: >-
        -args "${input.X}" "${input.nn_y}" ${run.reference_rows} ${run.query_rows}
        ${run.neighbours} "${run.outputs}/systemds-predictions-r${rep}"
    inputs: {X: {artifact: X}, nn_y: {artifact: nn_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      - id: dask-brute-force
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/knn/dask_array.py" "${dataset.dir}"
          --reference-rows ${run.reference_rows} --query-rows ${run.query_rows}
          --neighbours ${run.neighbours} --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # Extreme factor/intermediate stress: at four million rows, rank 512 makes W,
  # X%*%t(H), and W%*%(H%*%t(H)) 16.384 GB (15.26 GiB) apiece. A single one of
  # these exceeds the 12g JVM heap. Three updates retain meaningful iterative
  # reuse while bounding the roughly 12.4 TFLOP cost of each update. CP and NumPy
  # are deliberately absent: W alone exhausts their available memory, whereas
  # this case is intended to compare the spill-capable engines. All three arms
  # materialize the learned factors, as in the regular GNMF benchmark.
  - id: gnmf_rank_stress
    dataset: gnmf_d32
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/gnmf/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 12500
      rank: 512
      iterations: 3
      epsilon: 1e-8
      seed: 23
      systemds_args: >-
        -args "${input.X}" ${run.rank} ${run.iterations} ${run.epsilon} ${run.seed}
        "${run.outputs}/systemds-W-r${rep}" "${run.outputs}/systemds-H-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 3600}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: dask-multiplicative-updates
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/gnmf/dask_array.py" "${dataset.dir}"
          --rank ${run.rank} --iterations ${run.iterations} --epsilon ${run.epsilon}
          --seed ${run.seed} --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # ---------------------------------------------------------------------------
  # Phase 6 -- least-validated workloads, deliberately last
  #
  # These three are held to the end because they are the ones most likely to fail:
  # the kernel-ridge arms have not been exercised at these sizes, and pagerank is the
  # only sparse workload, on the only real-world dataset, built by the only generator
  # that has not yet completed a clean run. Ordering them last means a failure here
  # costs nothing that came before it -- and since each dataset is staged immediately
  # before its own run, twitter-2010 is not generated until everything else is
  # measured and safely on disk.
  #
  # The cost is that phase 1 is no longer full backend coverage: krr and pagerank are
  # the two workloads whose first execution now happens late rather than early.
  # ---------------------------------------------------------------------------
  # Exact kernel ridge: the Gram matrix is loop-invariant and re-read every CG step,
  # which separates an engine that keeps a disk-resident operand from one that recomputes.
  - id: kernel_ridge
    dataset: krr_50k
    resource_profiles: [mem16]
    parameter_cases: krr_anchor
    entrypoint: ${plan.dir}/kernel_ridge/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      # 2,500 rows is 2.6 MB of input but 50 MB of Gram matrix once squared onto
      # the columns, and divides all three sizes in `krr_size` exactly.
      dask_chunk: 2500
      gamma: 0.01
      reg: 1.0
      cg_iterations: 20
      systemds_args: >-
        -args "${input.X}" "${input.nn_y}" ${run.train_rows} ${run.gamma}
        ${run.reg} ${run.cg_iterations} "${run.outputs}/systemds-alpha-r${rep}"
    inputs: {X: {artifact: X}, nn_y: {artifact: nn_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      # The 1.25 GB Gram matrix plus inputs fits the 12 GiB heap.
      - {id: systemds-cp, template: systemds-cp, enabled: true}
      # In-RAM Gram matrix, which is what sklearn.kernel_ridge builds and what
      # knn/numpy.py does. Expected to be OOM-killed above the profile's limit;
      # add --kernel-memmap for the disk-backed formulation and report the
      # stronger of the two.
      - id: numpy-kernel-ridge
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/kernel_ridge/numpy.py" "${dataset.dir}"
          --train-rows ${run.train_rows} --gamma ${run.gamma} --reg ${run.reg}
          --cg-iterations ${run.cg_iterations} --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-kernel-ridge
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/kernel_ridge/dask_array.py" "${dataset.dir}"
          --train-rows ${run.train_rows} --gamma ${run.gamma} --reg ${run.reg}
          --cg-iterations ${run.cg_iterations} --chunk-rows ${run.dask_chunk}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # Gram matrix 5.0 / 20.0 GB from at most 51 MB of input.
  - id: kernel_ridge_size
    dataset: krr_50k
    resource_profiles: [mem16]
    parameter_cases: krr_rest
    entrypoint: ${plan.dir}/kernel_ridge/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      # 2,500 rows is 2.6 MB of input but 50 MB of Gram matrix once squared onto
      # the columns, and divides all three sizes in `krr_size` exactly.
      dask_chunk: 2500
      gamma: 0.01
      reg: 1.0
      cg_iterations: 20
      systemds_args: >-
        -args "${input.X}" "${input.nn_y}" ${run.train_rows} ${run.gamma}
        ${run.reg} ${run.cg_iterations} "${run.outputs}/systemds-alpha-r${rep}"
    inputs: {X: {artifact: X}, nn_y: {artifact: nn_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      # The 20 GB Gram case cannot fit the 12 GiB baseline budget. Use the
      # implementation's equivalent disk-backed formulation for the size series.
      - id: numpy-kernel-ridge
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/kernel_ridge/numpy.py" "${dataset.dir}"
          --train-rows ${run.train_rows} --gamma ${run.gamma} --reg ${run.reg}
          --cg-iterations ${run.cg_iterations} --kernel-memmap
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-kernel-ridge
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/kernel_ridge/dask_array.py" "${dataset.dir}"
          --train-rows ${run.train_rows} --gamma ${run.gamma} --reg ${run.reg}
          --cg-iterations ${run.cg_iterations} --chunk-rows ${run.dask_chunk}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # PageRank on twitter-2010. No Dask arm: the input is sparse CSR.
  - id: pagerank
    dataset: twitter_10k
    resource_profiles: [mem16_pagerank]
    entrypoint: ${plan.dir}/pagerank/systemds.dml
    blocksize_sweeps: {ooc: [10000], spark: [10000]}
    parameters:
      iterations: 15
      alpha: 0.85
      systemds_args: >-
        -args "${input.G}" "${input.dangling}" ${run.alpha} ${run.iterations}
        "${run.outputs}/systemds-r${rep}"
    inputs: {G: {artifact: G}, dangling: {artifact: dangling}}
    resources: {timeout_seconds: 1800, timeout_grace_seconds: 30}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      - id: scipy-csr-memmap
        template: python
        enabled: true
        required_python_modules: [numpy, scipy]
        command: >-
          "${tools.python}" "${plan.dir}/pagerank/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations} --alpha ${run.alpha}
          --output "${run.outputs}/scipy-r${rep}.npy"

  # ---------------------------------------------------------------------------
  # Phase 7 -- untested staging, last of all
  #
  # dense_d32_wide has never been generated. Its 800 MB staging chunks are six
  # times anything that has succeeded so far, and an unpreparable dataset aborts a
  # measurement run outright -- so these go after every run whose data is already
  # on disk, and a staging failure here costs only these two.
  # ---------------------------------------------------------------------------

  # 40k x 100k.
  - id: lmcg_wide
    dataset: dense_d32_wide
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/lmcg/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 125
      iterations: 10
      reg: 1e-7
      tolerance: 0.0
      systemds_args: >-
        -args "${input.X}" "${input.y}" ${run.reg} ${run.iterations} ${run.tolerance}
        "${run.outputs}/systemds-beta-r${rep}"
    inputs: {X: {artifact: X}, y: {artifact: binary_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      - id: numpy-cg
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/lmcg/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations} --reg ${run.reg} --tolerance ${run.tolerance}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-cg
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/lmcg/dask_array.py" "${dataset.dir}"
          --iterations ${run.iterations} --reg ${run.reg} --tolerance ${run.tolerance}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # 40k x 100k.
  - id: kmeans_wide
    dataset: dense_d32_wide
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/kmeans/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 125
      clusters: 32
      iterations: 10
      systemds_args: >-
        -args "${input.X}" ${run.clusters} ${run.iterations}
        "${run.outputs}/systemds-centers-r${rep}"
        "${run.outputs}/systemds-labels-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - {id: systemds-cp, template: systemds-cp}
      - id: numpy-lloyd
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/kmeans/numpy.py" "${dataset.dir}"
          --clusters ${run.clusters} --iterations ${run.iterations}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: sklearn-minibatch
        template: python
        required_python_modules: [numpy, sklearn]
        command: >-
          "${tools.python}" "${plan.dir}/kmeans/sklearn_batching.py" "${dataset.dir}"
          --clusters ${run.clusters} --passes ${run.iterations}
          --batch-rows ${run.dask_chunk}
          --output "${run.outputs}/sklearn-r${rep}.json"
      - id: dask-lloyd
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/kmeans/dask_array.py" "${dataset.dir}"
          --clusters ${run.clusters} --iterations ${run.iterations}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # CP codegen references only where the 32 GB input fits the 96 GiB heap.
  - <<: *lmcg_memory_run
    id: lmcg_spoof
    resource_profiles: [mem128]
    implementations:
      - {id: systemds-cp, template: systemds-cp, enabled: true}
      - {id: systemds-cp-spoof, template: systemds-cp-spoof}
  - <<: *kmeans_memory_run
    id: kmeans_spoof
    resource_profiles: [mem128]
    implementations:
      - {id: systemds-cp, template: systemds-cp, enabled: true}
      - {id: systemds-cp-spoof, template: systemds-cp-spoof}
  - <<: *multilogreg_memory_run
    id: multilogreg_spoof
    resource_profiles: [mem128]
    implementations:
      - {id: systemds-cp, template: systemds-cp, enabled: true}
      - {id: systemds-cp-spoof, template: systemds-cp-spoof}

  # ---------------------------------------------------------------------------
  # Phase 8 -- external, long-running staging, last of all
  #
  # SliceLine downloads and preprocesses the complete CriteoD21 workload. Keep
  # it behind every synthetic and already-staged workload so a slow or failed
  # external preparation cannot prevent the rest of the sweep from completing.
  # ---------------------------------------------------------------------------
  - id: sliceline_criteo
    dataset: criteo_d21
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/sliceline/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      systemds_args: >-
        -args "${input.X}" "${input.e}" "${run.outputs}/systemds-scores-r${rep}"
    inputs: {X: {artifact: X}, e: {artifact: e}}
    resources: {timeout_seconds: 14400, timeout_grace_seconds: 30}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark, enabled: true}
