  # ---------------------------------------------------------------------------
  # Phase 3 -- data size
  #
  # Budget fixed at 32 GB, data walked 16 -> 32 -> 64 GB: 0.5x, 1x and 2x
  # data:memory, so the ratio crosses 1 inside one series.
  # ---------------------------------------------------------------------------
