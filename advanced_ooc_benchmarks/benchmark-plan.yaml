        template: python
        command: >-
          "${tools.python}" "${plan.dir}/l2svm/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations} --inner-iterations ${run.inner_iterations}
          --tolerance ${run.tolerance} --reg ${run.reg}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-cg-linesearch
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/l2svm/dask_array.py" "${dataset.dir}"
          --iterations ${run.iterations} --inner-iterations ${run.inner_iterations}
          --tolerance ${run.tolerance} --reg ${run.reg}
          --threads ${resources.dask_threads} --workers ${resources.dask_workers}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # Multinomial logistic regression, TRON.
  - id: multilogreg
    dataset: dense_d32
    resource_profiles: [mem16]
    entrypoint: ${plan.dir}/multilogreg/systemds.dml
    blocksize_sweeps: {ooc: [1000], spark: [1000]}
    parameters:
      dask_chunk: 12500
      # Raised from 1/1: one outer and one inner step is a single gradient step, not
      # multinomial logistic regression. TRON costs roughly outer*(2+2*inner) passes
      # over X, so 1/1 was 4 passes and 5/10 would be 110 -- 3/5 gives 36, a real fit
      # that keeps the case inside a sane timeout at 32 GB.
      iterations: 3
      inner_iterations: 5
      tolerance: 1e-8
      reg: 1.0
      systemds_args: >-
        -args "${input.X}" "${input.y}" ${run.tolerance} ${run.reg}
        ${run.iterations} ${run.inner_iterations} "${run.outputs}/systemds-r${rep}"
    inputs: {X: {artifact: X}, y: {artifact: binary_y}}
