  # ---------------------------------------------------------------------------
  # 16 / 32 / 64 GB against a 32 GB budget.
  - id: lmcg_datasize
    dataset: {group: dense_ladder}
    resource_profiles: [mem32]
    entrypoint: ${plan.dir}/lmcg/systemds.dml
