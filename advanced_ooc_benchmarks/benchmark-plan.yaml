  - id: gmm_vvi_3g
    enabled: false
    dataset: dense_1m
    entrypoint: ${plan.dir}/gmm/systemds.dml
    blocksize_sweeps: {ooc: [500], spark: [1000]}
    parameters:
      dask_chunk: 12500   # divides dense_1m exactly; this run has no Dask arm today
      components: 4
      model: VVI
      iterations: 1
      reg: 1e-6
      tolerance: 1e-8
      seed: 17
      systemds_args: >-
        -args "${input.X}" ${run.components} ${run.model} ${run.iterations}
        ${run.reg} ${run.tolerance} ${run.seed}
        "${run.outputs}/systemds-mu-r${rep}" "${run.outputs}/systemds-weight-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {memory_max: 4G, java_heap: 3g, timeout_seconds: 300}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: sklearn-em
        template: python
        required_python_modules: [numpy, sklearn]
        command: >-
          "${tools.python}" "${plan.dir}/gmm/numpy.py" "${dataset.dir}"
          --components ${run.components} --model ${run.model} --iterations ${run.iterations}
          --reg ${run.reg} --tolerance ${run.tolerance} --seed ${run.seed}
          --output "${run.outputs}/sklearn-r${rep}.json"

  # Newly added workloads are disabled until one blocksize/backend at a time has
  # completed a host smoke run under the 3 GiB heap and 4 GiB cgroup.
  - id: kmeans_scaling
    enabled: true
    dataset: {group: dense_scaling}
    resource_profiles: {group: scaling}
    entrypoint: ${plan.dir}/kmeans/systemds.dml
    blocksize_sweeps: {ooc: [500, 1000], spark: [1000]}
    parameters:
      # Row chunk for the prepared Zarr store: 95 MiB at 1000 columns, inside Dask's
      # ~100 MiB guidance, and an exact divisor of every dense dataset so no trailing
      # chunk is padded. Full-width rows, not square tiles: every kernel here is a
      # row-local reduction, and splitting columns forces a combine none of them ask for.
      dask_chunk: 12500
      clusters: 16
      # raised from 2: Lloyd's algorithm runs to convergence; 2 steps is one refinement.
      iterations: 10
      systemds_args: >-
        -args "${input.X}" ${run.clusters} ${run.iterations}
        "${run.outputs}/systemds-centers-r${rep}"
        "${run.outputs}/systemds-labels-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 1200}
    setup: *systemds_setup
