          --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  - id: pca_scaling
    enabled: true
    dataset: {group: dense_scaling}
    resource_profiles: {group: scaling}
    entrypoint: ${plan.dir}/pca/systemds.dml
    blocksize_sweeps: {ooc: [500, 1000], spark: [1000]}
    parameters:
      # Row chunk for the prepared Zarr store: 95 MiB at 1000 columns, inside Dask's
      # ~100 MiB guidance, and an exact divisor of every dense dataset so no trailing
      # chunk is padded. Full-width rows, not square tiles: every kernel here is a
      # row-local reduction, and splitting columns forces a combine none of them ask for.
      dask_chunk: 12500
      components: 16
      systemds_args: >-
        -args "${input.X}" ${run.components}
        "${run.outputs}/systemds-scores-r${rep}"
        "${run.outputs}/systemds-components-r${rep}"
