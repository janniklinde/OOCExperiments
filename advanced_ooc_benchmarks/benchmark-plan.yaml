      systemds_args: >-
        -args "${input.X}" ${run.rank} ${run.reg} ${run.iterations} ${run.seed}
        "${run.outputs}/systemds-U-r${rep}" "${run.outputs}/systemds-V-r${rep}"
    inputs: {X: {artifact: X}}
    resources: {timeout_seconds: 300}
    setup: *systemds_setup
