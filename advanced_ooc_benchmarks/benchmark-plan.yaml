        command: >-
          "${tools.python}" "${plan.dir}/lmcg/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations} --reg ${run.reg} --tolerance ${run.tolerance}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-cg
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/lmcg/dask_array.py" "${dataset.dir}"
          --iterations ${run.iterations} --reg ${run.reg} --tolerance ${run.tolerance}
          --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  - id: connected_components_scaling
    enabled: false
    dataset: {group: cc_scaling}
    resource_profiles: {group: scaling}
    entrypoint: ${plan.dir}/connected_components/systemds.dml
    # 2,500, not the 500 the dense workloads use. SystemDS budgets an OOC tile as if it were
    # dense, so a sparse graph at blocksize 500 would put 2.3 nonzeros in each of 1.2 billion
    # blocks; 2,500 puts 1.05 MiB in each of 28,900. It is also the largest round value with
    # headroom under the mem4 profile's ceiling of 2,991 (see the cc_d4 dataset comment).
    blocksize_sweeps: {ooc: [2500], spark: [2500]}
    parameters:
      # Rows per Dask COO chunk. About 38 MB of stored edges at degree 6,300, and an exact
      # divisor of all four cc datasets so no band is short. It also yields 850 chunks at
      # cc_d32 -- well above the two-per-thread floor below which threads sit idle -- while
      # keeping a chunk's live nonzeros an order of magnitude under the smallest budget.
      band_rows: 500
      # A cap, not a target. Max-label propagation converges in about the graph diameter,
      # which the power-of-two offset ladder puts near log2(vertices/band); all three arms
      # stop on the identical `diff == 0` test, so they perform the same number of passes.
      # 60 leaves generous headroom over the ~18 expected at cc_d32.
      iterations: 60
      systemds_args: >-
        -args "${input.G}" ${run.iterations}
        "${run.outputs}/systemds-C-r${rep}"
    inputs: {G: {artifact: G}}
    resources: {timeout_seconds: 5400}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      # SciPy is present for the CSR layout but has no out-of-core execution: the gather
      # this kernel needs is one float per stored edge, so this arm is expected to complete
      # only on the smaller instances and to exhaust memory at cc_d32. That is the result,
      # not a defect -- but read it as a statement about whole-array NumPy, not about CSR.
      - id: numpy-label-propagation
        template: python
        required_python_modules: [numpy]
        command: >-
          "${tools.python}" "${plan.dir}/connected_components/numpy.py" "${dataset.dir}"
          --iterations ${run.iterations}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-label-propagation
        template: dask
        required_python_modules: [numpy, dask.array, distributed, sparse]
        command: >-
          "${tools.python}" "${plan.dir}/connected_components/dask_array.py" "${dataset.dir}"
          --band-rows ${run.band_rows} --iterations ${run.iterations}
          --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # Intermediate-bound: the input fits in memory at every profile and the feature
  # map does not. Nothing in the closed form needs the map as a whole, so an engine
  # that streams it never holds more than a block; one that materializes it must
  # find up to 33 GB. The Gram is D/4 flops per byte of map -- 128 at rf4, 512 at
  # rf16 -- so this is the compute-dense half of the pair, where a streaming engine
  # has the most room to hide its reads.
  - id: random_features_scaling
    enabled: false
    dataset: rf_1m
    resource_profiles: {group: scaling}
    parameter_cases: rf_width
    entrypoint: ${plan.dir}/random_features/systemds.dml
    blocksize_sweeps: {ooc: [500], spark: [1000]}
    parameters:
      # 100,000 rows is 102 MB at 128 columns and an exact divisor of the dataset.
      dask_chunk: 100000
      gamma: 0.01
      reg: 1.0
      seed: 41
      systemds_args: >-
        -args "${input.X}" "${input.binary_y}"
        "${run.results}/projection/W-f${run.features}.csv" ${run.reg}
        "${run.outputs}/systemds-beta-r${rep}"
    inputs: {X: {artifact: X}, binary_y: {artifact: binary_y}}
    resources: {timeout_seconds: 2400}
    # The projection is written once per case, outside the timed scope, and read by
    # all four arms. Generating it inside each arm would compare three random number
    # generators instead of one feature map; a prepared file makes them identical by
    # construction. It is cheap enough (a few megabytes) to rebuild per case rather
    # than to track as a dataset artifact.
    setup:
      - *systemds_setup
      - command: |
          "${tools.python}" "${plan.dir}/random_features/prepare_projection.py" --out "${run.results}/projection" --cols ${dataset.cols} --features ${run.features} --gamma ${run.gamma} --seed ${run.seed}
    baseline_setup:
      - command: |
          "${tools.python}" "${plan.dir}/random_features/prepare_projection.py" --out "${run.results}/projection" --cols ${dataset.cols} --features ${run.features} --gamma ${run.gamma} --seed ${run.seed}
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: numpy-ridge
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/random_features/numpy.py" "${dataset.dir}"
          --projection "${run.results}/projection/W-f${run.features}" --reg ${run.reg}
          --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-ridge
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/random_features/dask_array.py" "${dataset.dir}"
          --projection "${run.results}/projection/W-f${run.features}" --reg ${run.reg}
          --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  # Intermediate-bound, traffic-dominated: the distance matrix is the same size as
  # the feature map above but costs only d/4 flops per byte to build, and the
  # selection loop then sweeps it k more times. This is the quadratic wall that
  # makes practitioners subsample a training set rather than use all of it.
  - id: knn_scaling
    enabled: false
    dataset: knn_200k
    resource_profiles: {group: scaling}
    parameter_cases: knn_reference
    entrypoint: ${plan.dir}/knn/systemds.dml
    blocksize_sweeps: {ooc: [500], spark: [1000]}
    parameters:
      # 5,000 rows is 20 MB at 512 columns -- below the usual guidance, but it is the
      # largest chunk that divides every boundary this run slices at, and 40 chunks
      # is far too few for per-task overhead to matter.
      dask_chunk: 5000
      query_rows: 25000
      neighbours: 5
      systemds_args: >-
        -args "${input.X}" "${input.nn_y}" ${run.reference_rows} ${run.query_rows}
        ${run.neighbours} "${run.outputs}/systemds-predictions-r${rep}"
    inputs: {X: {artifact: X}, nn_y: {artifact: nn_y}}
    resources: {timeout_seconds: 3600}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: numpy-brute-force
        template: python
        command: >-
          "${tools.python}" "${plan.dir}/knn/numpy.py" "${dataset.dir}"
          --reference-rows ${run.reference_rows} --query-rows ${run.query_rows}
          --neighbours ${run.neighbours} --output "${run.outputs}/numpy-r${rep}.json"
      - id: dask-brute-force
        template: dask
        command: >-
          "${tools.python}" "${plan.dir}/knn/dask_array.py" "${dataset.dir}"
          --reference-rows ${run.reference_rows} --query-rows ${run.query_rows}
          --neighbours ${run.neighbours} --threads ${resources.dask_threads}
          --memory-limit ${resources.dask_memory_limit} --temporary-directory "${run.results}/dask-spill"
          --output "${run.outputs}/dask-r${rep}.json"

  - id: l2svm_scaling
    enabled: true
    dataset: {group: dense_scaling}
    resource_profiles: {group: scaling}
    entrypoint: ${plan.dir}/l2svm/systemds.dml
    blocksize_sweeps: {ooc: [500, 1000], spark: [1000]}
    parameters:
      # Row chunk for the prepared Zarr store: 95 MiB at 1000 columns, inside Dask's
      # ~100 MiB guidance, and an exact divisor of every dense dataset so no trailing
      # chunk is padded. Full-width rows, not square tiles: every kernel here is a
      # row-local reduction, and splitting columns forces a combine none of them ask for.
      dask_chunk: 12500
      # raised from 3: an SVM solved in 3 outer steps is not a converged fit, and at
      # 3 the ~15s JVM warmup dominated the measurement rather than the OOC path.
      iterations: 10
      inner_iterations: 20
      tolerance: 0.0
      reg: 1.0
      systemds_args: >-
        -args "${input.X}" "${input.y}" ${run.tolerance} ${run.reg}
        ${run.iterations} ${run.inner_iterations}
        "${run.outputs}/systemds-model-r${rep}"
    inputs: {X: {artifact: X}, y: {artifact: binary_y}}
    resources: {timeout_seconds: 1800}
    setup: *systemds_setup
    cold_cache: ["${dataset.dir}"]
    implementations:
      - {id: systemds-ooc, template: systemds-ooc}
      - {id: systemds-spark, template: systemds-spark}
      - id: numpy-cg-linesearch
        template: python
        command: >-
