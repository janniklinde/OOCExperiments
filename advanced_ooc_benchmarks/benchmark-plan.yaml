    blocksize_sweeps: {ooc: [500], spark: [1000]}
    parameters:
      dask_chunk: 12500
      clusters: 32
      # raised from 2: Lloyd's algorithm runs to convergence; 2 steps is one refinement.
      iterations: 10
      systemds_args: >-
        -args "${input.X}" ${run.clusters} ${run.iterations}
